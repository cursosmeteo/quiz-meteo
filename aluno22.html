<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<style>
/* KSA ENGINE — shared theme for teacher / group / student pages */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg2:#0f1520;--bg3:#161e30;--bg4:#1f2a42;--line:#2a3650;--line2:#3a4a6a;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;
  --text:#e8edf5;--text2:#9fb0c8;--text3:#5d7090;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.2)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--blue)}
textarea{resize:vertical}
.mono{font-family:var(--mono)}
.btn{border:1px solid var(--line2);background:var(--bg3);color:var(--text);border-radius:8px;padding:8px 14px;font-size:.88rem;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--blue);background:var(--bg4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#052e12}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#2a1700}
.btn.sm{padding:4px 10px;font-size:.78rem}
.btn.lg{padding:12px 22px;font-size:1rem}
.btn.ghost{background:transparent}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--text3);font-size:.82rem}
.lbl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg4);color:var(--text2);white-space:nowrap}
.pill.k{background:rgba(59,130,246,.18);color:#93c5fd}.pill.s{background:rgba(34,197,94,.18);color:#86efac}.pill.a{background:rgba(168,85,247,.18);color:#d8b4fe}
.pill.key{background:rgba(245,158,11,.18);color:#fcd34d}.pill.ind{background:rgba(6,182,212,.18);color:#67e8f9}
.pill.ok{background:rgba(34,197,94,.18);color:#86efac}.pill.no{background:rgba(239,68,68,.18);color:#fca5a5}.pill.wait{background:rgba(245,158,11,.15);color:#fcd34d}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--text3)}
.clock{font-family:var(--mono);font-weight:800;letter-spacing:.02em}
.clock.low{color:var(--amber)}.clock.out{color:var(--red)}

/* KSA bars */
.ksa{display:flex;flex-direction:column;gap:5px;min-width:180px}
.ksa .b{display:grid;grid-template-columns:16px 1fr 48px;gap:7px;align-items:center;font-size:.78rem;font-weight:700}
.ksa .tr{height:7px;background:var(--bg4);border-radius:99px;overflow:hidden}
.ksa .fi{height:100%;border-radius:99px;transition:width .6s}
.ksa .k .fi{background:var(--blue)}.ksa .s .fi{background:var(--green)}.ksa .a .fi{background:var(--purple)}
.ksa .k b{color:#93c5fd}.ksa .s b{color:#86efac}.ksa .a b{color:#d8b4fe}
.ksa .v{text-align:right;font-family:var(--mono);color:var(--text2)}
.ksa .tot{font-size:.78rem;color:var(--text2);text-align:right}

/* modal / toast / viewer */
.modal{position:fixed;inset:0;background:rgba(2,6,15,.86);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:min(1100px,100%);max-height:94vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal .mh b{flex:1}
.modal .mb{padding:14px;overflow:auto}
.viewer img{display:block;max-width:100%;margin:auto;background:#fff;cursor:zoom-in}
.viewer.full img{max-width:none;cursor:zoom-out}
.viewer pre{font:600 .95rem/1.6 var(--mono);white-space:pre-wrap;background:#0b1220;padding:14px;border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--line2);padding:10px 18px;border-radius:10px;font-weight:650;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* library list */
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-it{display:flex;gap:10px;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;text-align:left;color:var(--text)}
.lib-it:hover{border-color:var(--cyan)}
.lib-it .th{width:56px;height:40px;border-radius:5px;background:#fff center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.lib-it .th.t{background:#0b1220;color:var(--cyan);font-weight:800;font-size:.62rem}
.lib-it b{font-size:.85rem;display:block}
.lib-it span{font-size:.72rem;color:var(--text3)}

/* disclaimer */
.disc{max-width:820px;margin:18px auto 0;font-size:.8rem;line-height:1.55;color:var(--text2);border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.06);border-radius:10px;padding:10px 14px;text-align:left}
.disc b{color:#fbbf24}
/* route result table */
table.rt{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
table.rt th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.rt td{padding:4px 6px;border-bottom:1px solid rgba(42,54,80,.6);vertical-align:middle}
table.rt td:first-child{color:var(--text2);font-weight:600;width:38%}
table.rt input{padding:5px 7px;font-size:.88rem}
table.rt.show td{font-size:1.05rem;padding:7px 9px}
table.rt.show td:not(:first-child){color:var(--text);font-weight:650}
/* status bar */
.conn{font-size:.72rem;font-weight:700}
.conn.on{color:var(--green)}.conn.off{color:var(--red)}

</style>
<style>
main{max-width:560px;margin:0 auto;padding:16px 14px 50px}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:900}.brand em{font-style:normal;color:var(--blue)}
.sp{flex:1}
h1{font-size:1.35rem;font-weight:850;margin:6px 0}
.big{text-align:center;margin-top:10vh}.big .ic{font-size:3.4rem}
.q{font-size:1.15rem;font-weight:700;line-height:1.35;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.o{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg2);color:var(--text);border-radius:12px;padding:14px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
.o .L{width:34px;height:34px;border-radius:9px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}

.tbar{height:8px;background:var(--bg4);border-radius:99px;overflow:hidden;margin-top:6px}.tbar div{height:100%;background:var(--blue)}
.peer{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.crit{margin:8px 0}.crit span{font-size:.82rem;color:var(--text2)}
.sc{display:flex;gap:6px;margin-top:4px}.sc button{flex:1;border:1px solid var(--line2);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 0;font-weight:800;cursor:pointer}.sc button.on{background:var(--blue);border-color:var(--blue)}
input.name{font-size:1.15rem;padding:12px}

<script>/* ksa-flight.js */
/*!
 * KSA FLIGHT — ksa-flight.js (v2 · two flights + injections)
 * Core of the "flight along the route" KSA exercise (ATPL 050 Meteorology · Session 22).
 *  - chart projection: Lambert conformal fit of the WAFC chart graticule (+ small correction), or cubic fit (v1)
 *  - flight timeline along waypoints, injection (re-route / hold / ground stop) and lock times
 *  - grading of answer cells: wind (dddffGggKT), number range, choice
 *  - pre-test speed scoring (end-of-session quiz rules), group formation (best + last)
 *  - K / S / A scores
 * Carlos Paizinho · cursos.meteo@gmail.com · Developed with Claude (Anthropic)
 */
(function (root) {
'use strict';
const D2R = Math.PI / 180;

// ── projection & geometry ──────────────────────────────────────────────
function project(T, lon, lat) {
  if (T.type === 'lcc') {
    const [n, l0, X0, Y0, Fk] = T.lcc;
    const th = n * (lon - l0) * D2R, rho = Fk * Math.pow(Math.tan(Math.PI / 4 - lat * D2R / 2), n);
    let x = X0 + rho * Math.sin(th), y = Y0 + rho * Math.cos(th);
    const u = (x - 300) / 300, v = (y - 400) / 400, t = [1, u, v, u * u, u * v, v * v];
    let dx = 0, dy = 0; for (let i = 0; i < 6; i++) { dx += T.cx[i] * t[i]; dy += T.cy[i] * t[i]; }
    return [(x + dx - T.ox) * T.s, (y + dy - T.oy) * T.s];
  }
  const a = lon / T.scale, b = lat / T.scale;
  let x = 0, y = 0, k = 0;
  for (let i = 0; i <= T.deg; i++) for (let j = 0; j <= T.deg - i; j++) { const f = Math.pow(a, i) * Math.pow(b, j); x += f * T.cx[k]; y += f * T.cy[k]; k++; }
  return [x - T.x0, y - T.y0];
}
function gcPoint(A, B, f) {             // A,B = [lat,lon]
  const [p1, l1, p2, l2] = [A[0] * D2R, A[1] * D2R, B[0] * D2R, B[1] * D2R];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  if (d < 1e-9) return A.slice();
  const a = Math.sin((1 - f) * d) / Math.sin(d), b = Math.sin(f * d) / Math.sin(d);
  const x = a * Math.cos(p1) * Math.cos(l1) + b * Math.cos(p2) * Math.cos(l2);
  const y = a * Math.cos(p1) * Math.sin(l1) + b * Math.cos(p2) * Math.sin(l2);
  const z = a * Math.sin(p1) + b * Math.sin(p2);
  return [Math.atan2(z, Math.hypot(x, y)) / D2R, Math.atan2(y, x) / D2R];
}
function gcDist(A, B) {                 // km
  const [p1, l1, p2, l2] = [A[0] * D2R, A[1] * D2R, B[0] * D2R, B[1] * D2R];
  return 6371 * 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
}
const nm = (A, B) => gcDist(A, B) / 1.852;
const LL = p => [p.lat, p.lon];

// ── timeline (real minutes from the start of the flight phase) ─────────
/**
 * F = { etd:'HHMM', gs (kt), preflightMin, legMin, points:[{id,lat,lon,legMin?}],
 *       injection:{ id, atLeg (fraction of planned legs), holdMin, holdSim, newPoints:[{id|via, legMin, stopMin, stopSim}], cells? } }
 * timeline(F, injected) → nodes [{id, lat, lon, at, sim, stop, stopSim, kind:'pt'|'inj'|'new'}]
 */
function planned(F) {
  const out = []; let at = F.preflightMin, sim = 0;
  F.points.forEach((p, i) => {
    if (i) { at += p.legMin || F.legMin; sim += nm(LL(F.points[i - 1]), LL(p)) / F.gs * 60; }
    out.push({ id: p.id, lat: p.lat, lon: p.lon, at, sim, stop: 0, stopSim: 0, kind: 'pt' });
  });
  return out;
}
function injAt(F) {
  const J = F.injection; if (!J) return null;
  const P = planned(F), k = Math.floor(J.atLeg), f = J.atLeg - k, a = P[k], b = P[k + 1];
  return { k, t: a.at + f * (b.at - a.at), sim: a.sim + f * (b.sim - a.sim), pos: gcPoint(LL(a), LL(b), f) };
}
function newPoint(F, np) { return np.via ? Object.assign({}, F.points.find(p => p.id === np.via), { legMin: np.legMin, stopMin: np.stopMin, stopSim: np.stopSim }) : np; }
function timeline(F, injected) {
  const P = planned(F);
  if (!injected || !F.injection) return P;
  const J = F.injection, I = injAt(F);
  const out = P.slice(0, I.k + 1);
  out.push({ id: '@INJ', lat: I.pos[0], lon: I.pos[1], at: I.t, sim: I.sim, stop: J.holdMin || 0, stopSim: J.holdSim || 0, kind: 'inj' });
  let t = I.t + (J.holdMin || 0), s = I.sim + (J.holdSim || 0), prev = out[out.length - 1];
  J.newPoints.forEach(np => {
    const p = newPoint(F, np);
    t += np.legMin; s += nm(LL(prev), LL(p)) / F.gs * 60;
    const n = { id: p.id, lat: p.lat, lon: p.lon, at: t, sim: s, stop: np.stopMin || 0, stopSim: np.stopSim || 0, kind: 'new' };
    out.push(n); t += n.stop; s += n.stopSim; prev = n;
  });
  return out;
}
function simStr(F, m) {
  const v = ((parseInt(F.etd.slice(0, 2), 10) * 60 + parseInt(F.etd.slice(2), 10) + Math.round(m)) % 1440 + 1440) % 1440;
  return String(Math.floor(v / 60)).padStart(2, '0') + String(v % 60).padStart(2, '0') + 'Z';
}
/** state of the flight at real minute t */
function flightState(F, t, injected) {
  const N = timeline(F, injected), first = N[0], last = N[N.length - 1];
  const S = (stage, pos, ahead, sim, extra) => Object.assign({ stage, pos, ahead, simMin: sim, sim: simStr(F, sim) }, extra || {});
  if (t < first.at) return S('pre', LL(first), LL(N[1]), 0, { leftToTakeoff: first.at - t });
  for (let i = 0; i < N.length; i++) {
    const n = N[i];
    if (n.stop && t >= n.at && t < n.at + n.stop) {
      const q = (t - n.at) / n.stop, sim = n.sim + q * n.stopSim;
      if (n.kind === 'inj') {
        const r = F.injection.holdRadius || 0.2, ang = q * 2 * Math.PI * 2;
        const pos = [n.lat + r * Math.sin(ang), n.lon + r * 1.4 * (1 - Math.cos(ang))];
        const ahead = [n.lat + r * Math.sin(ang + 0.3), n.lon + r * 1.4 * (1 - Math.cos(ang + 0.3))];
        return S('hold', pos, ahead, sim, { node: n, left: n.at + n.stop - t });
      }
      return S('stop', LL(n), N[i + 1] ? LL(N[i + 1]) : LL(n), sim, { node: n, left: n.at + n.stop - t });
    }
    const nx = N[i + 1];
    if (!nx) break;
    const dep = n.at + n.stop;
    if (t >= dep && t < nx.at) {
      const q = (t - dep) / (nx.at - dep), sim = n.sim + n.stopSim + q * (nx.sim - n.sim - n.stopSim);
      return S('cruise', gcPoint(LL(n), LL(nx), q), gcPoint(LL(n), LL(nx), Math.min(1, q + 0.04)), sim, { from: n, to: nx, q });
    }
  }
  return S('arrived', LL(last), LL(last), last.sim, { node: last });
}
/**
 * lock (grading) times. Returns [{id, at, void?, card?, isNew?}] in time order.
 * Not injected: the planned points. Injected: planned points after the injection are void unless the
 * re-route goes through them again (then re-timed); new points and the injection card are added.
 */
function lockTimes(F, injected) {
  const P = planned(F);
  const out = P.map(n => ({ id: n.id, at: n.at }));
  if (!F.injection || !injected) return out;
  const J = F.injection, I = injAt(F), TL = timeline(F, true);
  const refs = J.newPoints.map(np => np.via || np.id);
  out.forEach(o => { if (o.at > I.t) { if (refs.includes(o.id)) o.at = TL.find(n => n.id === o.id && n.kind === 'new').at; else o.void = true; } });
  J.newPoints.filter(np => !np.via).forEach(np => out.push({ id: np.id, at: TL.find(n => n.id === np.id).at, isNew: true }));
  if (J.cells) out.push({ id: J.id, at: I.t + (J.holdMin || 0), card: true, isNew: true });
  return out.sort((a, b) => (a.void ? 1e9 : a.at) - (b.void ? 1e9 : b.at));
}
function routeTotalMin(F, injected) { const N = timeline(F, injected); const l = N[N.length - 1]; return l.at + l.stop; }
/** point object (cells, name…) for a lock id */
function pointById(F, id) {
  if (F.injection && id === F.injection.id) return { id, name: F.injection.title, fir: '', ref: 'Injection', cells: F.injection.cells };
  return F.points.find(p => p.id === id) || (F.injection ? F.injection.newPoints.find(p => p.id === id) : null);
}
function keyById(SC, F, id) { return ((SC.keys || {})[F.id] || {})[id] || null; }

// ── answer parsing & grading ───────────────────────────────────────────
function parseWind(s) {
  const t = String(s || '').toUpperCase().replace(/\s+/g, '').replace(/KTS?$/, 'KT');
  const m = t.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT)?$/);
  if (!m) return null;
  return { vrb: m[1] === 'VRB', dir: m[1] === 'VRB' ? null : +m[1], spd: +m[2], gust: m[3] ? +m[3] : null };
}
function parseNum(s) {
  const t = String(s ?? '').replace(/[−–]/g, '-').replace(',', '.').toUpperCase();
  const m = t.match(/[-+]?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
function inDir(d, [a, b]) {                 // circular range a→b clockwise
  a = ((a % 360) + 360) % 360; b = ((b % 360) + 360) % 360; d = ((d % 360) + 360) % 360;
  return a <= b ? d >= a && d <= b : d >= a || d <= b;
}
/**
 * cell: {id,label,type:'wind'|'num'|'choice'|'text', options?, unit?}
 * key : wind {dir:[a,b]|'any', vrb:bool, spd:[a,b], gust:false|[a,b]|null(not checked)} · num {min,max} · choice {ok:[...]}
 * → {pts, max, state:'ok'|'part'|'no'|'empty'|'ungraded', parts?}
 */
function gradeCell(cell, key, value) {
  const empty = value === undefined || value === null || String(value).trim() === '';
  if (cell.type === 'text') return { pts: 0, max: 0, state: empty ? 'empty' : 'ungraded' };
  if (!key) return { pts: 0, max: 0, state: 'ungraded' };
  if (cell.type === 'wind') {
    const max = 2 + (key.gust !== null && key.gust !== undefined ? 1 : 0);
    if (empty) return { pts: 0, max, state: 'empty' };
    const w = parseWind(value);
    if (!w) return { pts: 0, max, state: 'no', parts: { format: false } };
    const parts = {};
    parts.dir = key.dir === 'any' ? true : w.vrb ? !!key.vrb : inDir(w.dir, key.dir);
    parts.spd = w.spd >= key.spd[0] && w.spd <= key.spd[1];
    if (key.gust !== null && key.gust !== undefined) parts.gust = key.gust === false ? w.gust === null : (w.gust !== null && w.gust >= key.gust[0] && w.gust <= key.gust[1]);
    const pts = Object.values(parts).filter(Boolean).length;
    return { pts, max, state: pts === max ? 'ok' : pts ? 'part' : 'no', parts };
  }
  if (cell.type === 'num') {
    if (empty) return { pts: 0, max: 1, state: 'empty' };
    const v = parseNum(value);
    const ok = !isNaN(v) && v >= key.min && v <= key.max;
    return { pts: ok ? 1 : 0, max: 1, state: ok ? 'ok' : 'no' };
  }
  if (cell.type === 'choice') {
    if (empty) return { pts: 0, max: 1, state: 'empty' };
    const ok = (key.ok || []).map(String).includes(String(value));
    return { pts: ok ? 1 : 0, max: 1, state: ok ? 'ok' : 'no' };
  }
  return { pts: 0, max: 0, state: 'ungraded' };
}
function gradeBlock(cells, keys, answers) {
  const res = { cells: {}, pts: 0, max: 0, filled: 0, total: 0 };
  cells.forEach(c => {
    const g = gradeCell(c, (keys || {})[c.id], (answers || {})[c.id]);
    res.cells[c.id] = g; res.pts += g.pts; res.max += g.max;
    if (c.type !== 'text') { res.total++; if (g.state !== 'empty') res.filled++; }
  });
  return res;
}
function keyText(cell, key) {
  if (!key) return '—';
  if (cell.type === 'wind') {

<body>
<div class="top"><div class="brand">KSA <em>22</em></div><div class="muted" id="s-name"></div><div class="sp"></div><span class="conn" id="s-conn"></span></div>
<main id="main"><div class="big"><div class="ic">⏳</div><h1>Connecting…</h1></div></main>
<script>
'use strict';
const esc = KSAPP.esc;
let SC = null, DB = null, ST = {}, ME = null, MY = {}, GRP = {}, STU = {}, SCORE = null, PEER = null;
let ID = null; const P = KSAPP.params();
const idStore = { get: k => { try { return (P.mode === 'local' || P.test ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { (P.mode === 'local' || P.test ? sessionStorage : localStorage).setItem(k, v); } catch (e) { } } };
const A = {};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) { e.preventDefault(); A[b.dataset.a](b, e); } });
const M = h => document.getElementById('main').innerHTML = h;
const now = () => DB.now();

(async function init() {
  if (!P.s) return M(`<div class="big"><h1>Session code</h1><div class="row"><input id="cd" class="name" placeholder="e.g. S1015-ABC"><button class="btn pri" data-a="code">Go</button></div></div>`);
  try { DB = await KSADB.open(P.s, P.mode === 'local' ? 'local' : 'firebase'); } catch (e) { return M(`<div class="big"><h1>Connection failed</h1><p>${esc(e.message)}</p></div>`); }
  SC = await DB.get('pub/scenario');
  if (!SC) return M(`<div class="big"><h1>Session ${esc(DB.code)} not found</h1></div>`);
  DB.connected(on => { const c = document.getElementById('s-conn'); c.textContent = on ? '●' : '● offline'; c.className = 'conn ' + (on ? 'on' : 'off'); });
  ID = idStore.get('ksa22-' + DB.code);
  if (ID && !(await DB.get('students/' + ID))) ID = null;
  if (!ID) return joinView();
  go();
})();
A.code = () => { const c = document.getElementById('cd').value.trim().toUpperCase(); if (c) location.search = '?s=' + encodeURIComponent(c); };
function joinView() {
  M(`<h1>${esc(SC.meta.title)}</h1><p class="muted">KSA training · ATPL 050 Meteorology</p><div class="card" style="margin-top:16px"><div class="lbl">Your name</div><input id="nm" class="name" maxlength="30" autocomplete="off"><button class="btn pri lg" style="width:100%;margin-top:12px" data-a="join">Join ▶</button></div>${KSAPP.disclaimer(SC)}`);
  const i = document.getElementById('nm'); i.focus(); i.onkeydown = e => e.key === 'Enter' && A.join();
}
A.join = async () => {
  const n = document.getElementById('nm').value.trim(); if (n.length < 2) return KSAPP.toast('Write your name');
  ID = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await DB.set('students/' + ID, { name: n, at: now() }); idStore.set('ksa22-' + DB.code, ID); go();
};
function go() {
  DB.on('state', v => { ST = v || {}; render(); });
  DB.on('students', v => { STU = v || {}; MY = STU[ID] || {}; if (!STU[ID] && ST.phase) { idStore.set('ksa22-' + DB.code, ''); location.reload(); return; } document.getElementById('s-name').textContent = MY.name || ''; render(); });
  DB.on('groups', v => { GRP = v || {}; render(); });
  DB.on('scores/' + ID, v => { SCORE = v; render(); });
  DB.on('peer/' + ID, v => { if (!PEER) PEER = v || {}; render(); });
  setInterval(tick, 500);
}
let rT = null, lastSig = '';
function render() { if (rT) return; rT = setTimeout(() => { rT = null; draw(); }, 120); }
function draw() {
  if (!ST.phase || !ID) return;
  const sig = JSON.stringify([ST.phase, ST.pre, ST.preDone, MY.preAns && ST.pre ? MY.preAns[ST.pre.idx] : null, MY.pre, MY.group, ST.phase === 'peer' ? PEER : '', ST.phase === 'peer' ? GRP[MY.group] : '', SCORE, MY.name]);
  if (sig === lastSig) return; lastSig = sig;
  const ph = ST.phase, g = GRP[MY.group];
  if (ph === 'lobby') return M(`<div class="big"><div class="ic">✅</div><h1>You are in, ${esc(MY.name)}</h1><p class="muted">The pre-test starts soon: ${SC.pretest.questions.length} questions, ${SC.pretest.secondsPerQ}″ each. Faster correct answers score more (+6 … +1); wrong −4; no answer −2.</p></div>`);
  if (ph === 'pretest') return preView();
  if (ph === 'groups') return M(`<div class="big"><div class="ic">👥</div>${MY.pre ? `<p class="muted">Pre-test</p><h1>${MY.pre.pts} pts · ${MY.pre.correct}/${MY.pre.n} correct</h1>` : ''}${g ? `<h1 style="color:var(--cyan)">${esc(g.name)}</h1><p>${g.members.map(id => esc((STU[id] || {}).name)).join(' · ')}</p><p class="muted">Go to your group laptop.</p>` : '<p class="muted">Groups are being formed…</p>'}</div>`);
  if (ph === 'peer') return peerView();
  if (ph === 'debrief') return M(`<h1>Your KSA profile</h1>${KSAPP.ksaBars(SCORE, SC.scoring.weights)}<p class="muted" style="margin-top:10px">Training session — feedback, not assessment.</p>`);
  const txt = { f1: '🛩 Flight KSA001 (VFR Faro → Bragança) — work on the group laptop.', f2: '✈ Flight KSA002 (Porto → London FL350) — work on the group laptop.', briefing: '🎤 Briefings', break: '☕ Break' }[ph] || '';
  M(`<div class="big"><div class="ic">${g ? '👥' : '⏳'}</div><h1>${g ? esc(g.name) : ''}</h1><p>${txt}</p></div>${SCORE ? `<div style="margin-top:20px">${KSAPP.ksaBars(SCORE, SC.scoring.weights)}</div>` : ''}`);
}
// ── pre-test ──
function preView() {
  if (ST.preDone) return M(`<div class="big"><div class="ic">🏁</div><h1>${MY.pre ? MY.pre.pts + ' pts' : 'Done'}</h1>${MY.pre ? `<p>${MY.pre.correct}/${MY.pre.n} correct</p>` : ''}</div>`);
  const p = ST.pre || { idx: 0 }, q = SC.pretest.questions[p.idx]; if (!q) return;
  const a = (MY.preAns || {})[p.idx];
  M(`<div class="row between"><span class="lbl">Question ${p.idx + 1}/${SC.pretest.questions.length}</span><b id="ptm" class="mono"></b></div><div class="tbar"><div id="pbar"></div></div>
    <div class="q">${esc(q.text)}</div><div class="opts">${q.options.map((o, k) => `<button class="o ${a && +a.k === k ? 'sel' : ''}" data-a="ans" data-k="${k}" ${a || p.reveal ? 'disabled' : ''}><span class="L">${String.fromCharCode(65 + k)}</span>${esc(o)}</button>`).join('')}</div>
    <p class="muted" style="margin-top:12px;text-align:center">${a ? 'Answer registered ✓' : p.reveal ? 'Time is up' : ''}</p>`);
  tick();
}
A.ans = async b => {
  const p = ST.pre; if (!p || p.reveal || (MY.preAns || {})[p.idx]) return;
  document.querySelectorAll('.o').forEach(x => { x.disabled = true; x.classList.toggle('sel', x === b); });
  MY.preAns = Object.assign({}, MY.preAns, { [p.idx]: { k: +b.dataset.k, t: now() } });
  await DB.set(`students/${ID}/preAns/${p.idx}`, MY.preAns[p.idx]);
};
// ── peer ──
function peerView() {
  const g = GRP[MY.group]; if (!g) return M('<div class="big"><h1>No group</h1></div>');
  const mates = g.members.filter(id => id !== ID && STU[id]), C = SC.peer.criteria, n = SC.peer.scale;
  PEER = PEER || {};
  M(`<h1>Peer assessment</h1><p class="muted">Rate each team-mate from 1 (low) to ${n} (high). Anonymous for your colleagues.</p>
    ${mates.map(m => `<div class="peer"><b>${esc(STU[m].name)}</b>${C.map(c => `<div class="crit"><span>${esc(c.label)}</span><div class="sc">${Array.from({ length: n }, (_, k) => `<button class="${+((PEER[m] || {})[c.id]) === k + 1 ? 'on' : ''}" data-a="rate" data-m="${m}" data-c="${c.id}" data-v="${k + 1}">${k + 1}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
    <button class="btn go lg" style="width:100%" data-a="peerSend">Send ✓</button>`);
}
A.rate = b => { PEER[b.dataset.m] = PEER[b.dataset.m] || {}; PEER[b.dataset.m][b.dataset.c] = +b.dataset.v; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
A.peerSend = async () => { await DB.set('peer/' + ID, PEER); KSAPP.toast('Sent — thank you'); };
function tick() {
  if (ST.phase !== 'pretest' || !ST.pre || ST.preDone) return;
  const lim = SC.pretest.secondsPerQ * 1000, el = now() - ST.pre.at, left = Math.max(0, lim - el);
  const b = document.getElementById('pbar'); if (b) b.style.width = (ST.pre.reveal ? 0 : left / lim * 100) + '%';
  const t = document.getElementById('ptm'); if (t) t.textContent = ST.pre.reveal ? '' : Math.ceil(left / 1000) + '″';
  if (!ST.pre.reveal && left <= 0) document.querySelectorAll('.o').forEach(x => x.disabled = true);
}
</script>
