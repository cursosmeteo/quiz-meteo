ect":1,"explain":"Wide isobar spacing means a weak pressure gradient and light wind — a defining feature of anticyclones, in contrast to the tighter isobars of a depression."},{"id":"S13-2","s":13,"topic":"Pressure Systems","tag":"ANTICYCLONE · COLD vs WARM","code":"050 07 02 01","text":"A warm anticyclone, such as the Azores High, differs from a cold anticyclone in that it is:","options":["Shallow and driven by radiational cooling at the surface","Deep, sustained by upper convergence and subsidence, and very persistent","Only present in polar continental interiors during winter","Always accompanied by frontal systems"],"correct":1,"explain":"Warm anticyclones form from convergence and subsidence high in the troposphere, making them deep and slow-moving — unlike shallow, mobile cold anticyclones driven by surface radiational cooling."},{"id":"S13-3","s":13,"topic":"Pressure Systems","tag":"ANTICYCLONE · BLOCKING","code":"050 07 02 01","text":"A blocking anticyclone mainly affects the usual progression of frontal depressions by:","options":["Deepening them rapidly as they approach","Forcing them onto a more northerly (or southerly) track for days or weeks","Converting them directly into tropical revolving storms","Having no effect on their movement"],"correct":1,"explain":"A blocking high diverts the normal west-to-east progression of frontal depressions to higher (or lower) latitudes, holding its own weather in place for an extended period."},{"id":"S13-4","s":13,"topic":"Pressure Systems","tag":"ANTICYCLONE · WEATHER","code":"050 07 02 01","text":"The classic hazard for early-morning VFR flights under a persistent winter anticyclone is:","options":["Severe turbulence from strong surface winds","Embedded thunderstorms","Radiation fog or low stratus","Volcanic ash contamination"],"correct":2,"explain":"Light wind, clear skies and subsidence allow strong nocturnal cooling, favouring radiation fog and low stratus — a classic threat to VFR (and sometimes IFR) operations at first light."},{"id":"S13-5","s":13,"topic":"Pressure Systems","tag":"DEPRESSION · OROGRAPHIC","code":"050 07 03 01","text":"An orographic (lee) depression forms because:","options":["Surface heating expands and lifts the air column","Air deflected around a mountain range leaves a relative deficit of air on the lee side","Cold polar air is lifted over a warmer sea","A small low becomes embedded within a larger circulation"],"correct":1,"explain":"When air flows around, rather than over, a mountain range, it leaves a relative lack of air — and so lower pressure — on the lee (downwind) side, as in the classic Gulf of Genoa lee low."},{"id":"S13-6","s":13,"topic":"Pressure Systems","tag":"DEPRESSION · SECONDARY","code":"050 07 03 01","text":"A secondary depression is best described as:","options":["A large-scale frontal depression over temperate latitudes","A small low enclosed within the circulation of a larger, often occluded, primary depression","A thermal low that forms over a strongly heated desert","A tropical revolving storm in its final decay stage"],"correct":1,"explain":"Secondary depressions form within the primary circulation, on a trailing front from an occluded primary, or at the tip of an occluded warm sector — isobars need not even show a closed centre."},{"id":"S13-7","s":13,"topic":"Pressure Systems","tag":"DEPRESSION · TROUGH","code":"050 07 03 01","text":"A trough of low pressure, as drawn on a synoptic chart, is best recognised by:","options":["Isobars bulging outward from a high, indicating a ridge","A V-shaped kink of isobars extending outward from a low","A single closed isobar with no pressure gradient","Perfectly circular, evenly spaced isobars"],"correct":1,"explain":"A trough is the low-pressure mirror of a ridge — a V-shaped extension of isobars along which pressure is lower than on either side, typically bringing a wind shift and cooler, cloudier weather."},{"id":"S13-8","s":13,"topic":"Pressure Systems","tag":"TRS · FORMATION","code":"050 07 04 01","text":"Which of the following is NOT a requirement for the formation of a tropical revolving storm?","options":["Sea surface temperature above about 26°C","Strong upper-level wind shear","Latitude roughly between 5° and 25°","A deep layer of warm ocean water"],"correct":1,"explain":"Strong wind shear disrupts the storm's vertical structure and prevents organisation — a TRS needs very LITTLE shear to develop, along with warm, deep water and enough Coriolis force away from the Equator."},{"id":"S13-9","s":13,"topic":"Pressure Systems","tag":"TRS · INTENSITY SCALE","code":"050 07 04 01","text":"On the Saffir–Simpson Hurricane Wind Scale, sustained winds of 100 kt would place a storm in:","options":["Category 1","Category 2","Category 3 (major)","Category 5"],"correct":2,"explain":"Category 3 (major) covers roughly 96–113 kt sustained wind, with devastating expected damage. 100 kt falls within this range."},{"id":"S13-10","s":13,"topic":"Pressure Systems","tag":"TRS · AVOIDANCE","code":"050 07 04 02","text":"In the Northern Hemisphere, the worst weather in a tropical revolving storm is typically found:","options":["To the left of the storm's track","Equally distributed all around the storm","To the right of the storm's track","Directly ahead of the storm's centre only"],"correct":2,"explain":"The storm's forward speed adds to its rotational wind on the right-hand side of the track in the Northern Hemisphere (left in the Southern Hemisphere), producing the strongest winds and biggest storm surge there."},{"id":"S15-1","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · CIRCULATION","code":"050 08 01 01","text":"Which sequence correctly describes the Hadley cell?","options":["Air sinks at the Equator, moves poleward aloft and rises at about 30°","Air rises at about 30°, moves equatorward aloft and sinks at the Equator","Air rises at the Equator and flows equatorward at the surface, away from the subtropical highs","Air rises at the Equator, moves poleward aloft, sinks at about 30° and returns as trade winds"],"correct":3,"explain":"In the Hadley cell, air rises at the Equator (ITCZ), flows poleward aloft and subsides at about 30°N/S, forming the subtropical anticyclones. The surface return flow toward the Equator is the NE/SE trade winds."},{"id":"S15-2","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · KÖPPEN CLASSIFICATION","code":"050 08 01 02","text":"A region where evaporation exceeds precipitation and there are no permanent rivers belongs to which Köppen–Geiger class?","options":["Class B — dry climate, as in the Sahara","Class A — tropical rain climate, as in the Amazon basin","Class C — mid-latitude warm temperate climate, as in NW Europe","Class E — snow climate, as in Antarctica"],"correct":0,"explain":"Class B is defined by evaporation exceeding precipitation, with no permanent rivers (Sahara, ~20°–35°). Class A needs >60 mm rain every month; C is the temperate mid-latitude class; E is polar (warmest month <10°C)."},{"id":"S15-3","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · ITCZ","code":"050 08 02 03","text":"Which statement about the ITCZ is correct?","options":["It is a fixed, narrow band that always lies on the geographic Equator","It is a zone of clear skies and light winds with no significant cloud","Its width varies from about 25 to 300 nm, with Cb tops to 50,000 ft or more","It forms where the westerlies meet the polar easterlies at about 60°"],"correct":2,"explain":"The ITCZ (thermal equator) is where the NE and SE trade winds converge. Width is ~25–300 nm, with extensive Cu, Cb and TS, tops to 50,000 ft or more, and severe turbulence and icing. It follows the sun seasonally, so it is not fixed on the Equator."},{"id":"S15-4","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · MONSOONS","code":"050 08 02 04","text":"The winter NE monsoon over Asia is fed by:","options":["Moist SE trade winds crossing the Equator and veering SW","Cool, dry continental air flowing out of the Siberian High","Warm moist air drawn in toward a thermal low over the continent","Dry air descending leeward of the Himalayas as a Foehn"],"correct":1,"explain":"In winter, flow from the Siberian High is cool and dry over land; cloud and TS develop only over the sea track, especially where it crosses coastal mountains. The moist SE-trade flow crossing the Equator is the summer SW monsoon."},{"id":"S15-5","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · EASTERLY WAVES","code":"050 08 02 05","text":"African easterly waves, originating over West Africa between 5° and 20°N, typically:","options":["Move westward toward the Caribbean and may develop into a tropical revolving storm","Move eastward across the Indian Ocean and weaken over land","Remain stationary over West Africa all year, bringing dust","Form only in winter and bring fine weather with light winds"],"correct":0,"explain":"Easterly waves are westward-moving troughs of low pressure embedded in the tropical easterlies. About 50 occur each summer/autumn; their weather resembles a TRS, but less severe, and some develop into one."},{"id":"S15-6","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · WESTERLIES","code":"050 08 03 01","text":"Why are the Southern Hemisphere westerlies (\"Roaring Forties\") stronger and more constant than those of the Northern Hemisphere?","options":["The Coriolis force is stronger in the Southern Hemisphere","Few land masses interrupt the flow at these latitudes","The subtropical highs are weaker there than in the Northern Hemisphere","Sea surface temperatures are much higher at 40°S"],"correct":1,"explain":"In the Southern Hemisphere, westerlies between the subtropical highs and the sub-polar lows (40°–60°) are largely uninterrupted by land, so they stay strong all year. In the NH they are mainly over oceans and strongest and most constant in winter."},{"id":"S15-7","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · COLD-AIR DROP","code":"050 08 03 04","text":"A pocket of unusually cold air within a cold air mass can be located only by examining:","options":["Surface analysis charts, where it shows as a closed low","Satellite infra-red imagery, where it shows as clear sky","Thickness charts or upper contour charts, where it shows as low thickness","SIGWX charts, where it is marked with a jet stream symbol"],"correct":2,"explain":"A cold-air drop cannot be detected on surface analysis charts. It is located on thickness (e.g. 1000/500 hPa) or upper contour charts, where low thickness marks it. Typical weather: convective, with showers, TS, turbulence and ice formation."},{"id":"S15-8","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · FOEHN","code":"050 08 04 01","text":"A Foehn is warm and dry on the lee side of a mountain range because the air:","options":["Is heated by the sun as it descends the leeward slope","Descends at the SALR, warming more slowly than it cooled on ascent","Is compressed by friction against the leeward slope","Lost moisture as precipitation on ascent, then warms at the DALR on descent"],"correct":3,"explain":"Air forced up the windward side cools at the SALR once saturated and loses moisture as rain. On descent the dry air warms at the faster DALR, arriving warmer and drier than it started (Foehn in the Alps, Chinook in the Rockies)."},{"id":"S15-9","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · HARMATTAN","code":"050 08 04 02","text":"The Harmattan is best described as:","options":["A warm, moist SW wind blowing over the Gulf of Guinea in summer","A katabatic wind blowing down the Rhône valley in winter","A cool, dusty NE'ly wind from the Sahara, mainly November to April","A cold north wind behind cold fronts over southern South America"],"correct":2,"explain":"The Harmattan blows from the high-pressure desert areas of North Africa toward the ITCZ, mainly November–April (peak December/January). It can reduce visibility below 1000 m, with dust to 7,000–10,000 ft or more."},{"id":"S15-10","s":15,"topic":"Climatology","tag":"CLIMATOLOGY · BORA","code":"050 08 04 01","text":"EASA examines the Bora as which type of wind?","options":["A warm Foehn wind on the lee side of the Dinaric Alps","A katabatic wind blowing down to the North Adriatic","An anabatic wind driven by daytime heating of slopes","A sea breeze driven by land–sea temperature contrast"],"correct":1,"explain":"The Bora is part valley wind and part katabatic: cold dense air drains down to the North Adriatic with high pressure over Central Europe/the Balkans and a low over the Adriatic. About 70 kt, gusts >100 kt, strongest in winter."},{"id":"S16-1","s":16,"topic":"Icing & Turbulence","tag":"ICING · CONDITIONS","code":"050 09 01 01","text":"Airframe ice will form in flight when the aircraft meets liquid water and:","options":["The dew point is above 0°C","The relative humidity exceeds 50%","The aircraft is above the tropopause","Both the air and the airframe are at 0°C or below"],"correct":3,"explain":"Ice needs supercooled liquid water, air at or below 0°C and an airframe at or below 0°C. A cold-soaked airframe can even ice up when the air is slightly above 0°C."},{"id":"S16-2","s":16,"topic":"Icing & Turbulence","tag":"ICING · FREEZING RAIN","code":"050 09 01 01","text":"Freezing rain at low level is most likely to be encountered:","options":["Ahead of a warm front, in the cold air below the frontal surface","Behind a cold front, in polar air","Under a subtropical anticyclone","In the anvil of a mature Cb"],"correct":0,"explain":"Rain falls from the warm air above the frontal inversion into sub-zero air below, becomes supercooled and freezes on impact — typically about 1000 ft ahead of a warm front or occlusion."},{"id":"S16-3","s":16,"topic":"Icing & Turbulence","tag":"TYPES OF ICE · CLEAR","code":"050 09 01 02","text":"Clear (glaze) ice is most likely when flying through:","options":["Stratus at −25°C","Cirrostratus at −45°C","Cumulus with large supercooled droplets at −5°C","Clear air at −10°C with 60% relative humidity"],"correct":2,"explain":"Large supercooled drops (Cu, Cb, Ns, 0 to −10°C) freeze slowly because of latent heat release; water flows back and freezes as transparent ice with horns."},{"id":"S16-4","s":16,"topic":"Icing & Turbulence","tag":"TYPES OF ICE · RIME","code":"050 09 01 02","text":"Rime ice is best described as:","options":["Transparent ice formed by slow freezing and flowback","White, opaque ice formed by small droplets freezing instantly, trapping air","Ice formed directly from water vapour by sublimation","Ice that only forms at temperatures below −40°C"],"correct":1,"explain":"Small supercooled droplets freeze on impact; air is trapped between them, giving a white, opaque, light deposit that grows forward from the leading edge."},{"id":"S16-5","s":16,"topic":"Icing & Turbulence","tag":"TYPES OF ICE · HOAR FROST","code":"050 09 01 02","text":"Hoar frost is most likely to form on an aircraft:","options":["During a rapid descent from a very cold level into a warm, moist layer","While flying in Cb at −10°C","In freezing rain below a warm front","In cirrus cloud at −45°C"],"correct":0,"explain":"The cold-soaked airframe stays below 0°C while entering moist air: water vapour deposits directly as ice (sublimation). It is not severe and disappears in warmer air or with kinetic heating."},{"id":"S16-6","s":16,"topic":"Icing & Turbulence","tag":"HAZARDS · SEVERITY","code":"050 09 01 03","text":"Which cloud type is generally associated with the most severe airframe icing?","options":["Stratocumulus","Cumulus and cumulonimbus","Altostratus","Cirrus"],"correct":1,"explain":"Strong up-currents in Cu/Cb carry a high concentration of large supercooled drops — severe icing. Ns: moderate to severe; Sc: light to moderate; Ci, Cs, Cc: nil."},{"id":"S16-7","s":16,"topic":"Icing & Turbulence","tag":"PROTECTION · FLUIDS","code":"050 09 01 03","text":"Type I fluid is mainly used to:","options":["Give a long holdover time in continuous snowfall","Protect aircraft with slow rotation speed only","Remove ice, frost and snow — with only a short protection time","Replace the in-flight de-icing boots"],"correct":2,"explain":"Type I is a de-icing fluid (thin, unthickened). Types II, III and IV contain a thickening agent and are anti-icing fluids with longer holdover times; Type III is for aircraft with slow rotation speed."},{"id":"S16-8","s":16,"topic":"Icing & Turbulence","tag":"ENGINE ICING · CARBURETTOR","code":"050 09 01 01","text":"Carburettor icing is most dangerous:","options":["Only below −20°C in cloud","Only in clear air at high altitude","Only at high power settings","Between −10°C and +25°C in cloud, fog or precipitation, at any power setting"],"correct":3,"explain":"Fuel evaporation (latent heat) and adiabatic expansion in the venturi can cool the induction air by many degrees — ice can form even at positive OAT, especially at low (descent) power."},{"id":"S16-9","s":16,"topic":"Icing & Turbulence","tag":"ICE CRYSTAL ICING","code":"050 09 01 04","text":"Which indication suggests ice crystal icing (ICI) at high altitude?","options":["Rapid clear ice on the windshield wipers","Strong red returns on the weather radar at aircraft level","TAT stuck near 0°C and ‘rain’ on the windshield at very low temperature","Rapid rime build-up on the pitot probes"],"correct":2,"explain":"ICI crystals do not stick to the cold airframe and give weak radar returns. They ice the TAT probe (reading near 0°C) and melt on the heated windshield, sounding like rain."},{"id":"S16-10","s":16,"topic":"Icing & Turbulence","tag":"TURBULENCE · CAT","code":"050 09 02 02","text":"Clear Air Turbulence is best anticipated by using:","options":["The airborne weather radar","SIGWX / CAT forecasts and pilot reports","Lenticular clouds only","The TAT indication"],"correct":1,"explain":"CAT contains no water droplets, so radar cannot see it. Forecasts (SIGWX, CAT potential charts) are the main tool, supported by PIREPs."},{"id":"S17-1","s":17,"topic":"Flight Hazards","tag":"WIND SHEAR · DEFINITION","code":"050 09 03 01","text":"Vertical wind shear is expressed in:","options":["Knots per 1000 ft","Knots per nautical mile","Metres per second per kilometre","Knots per 100 ft"],"correct":3,"explain":"Vertical wind shear is measured in knots per 100 ft (anemometers at different heights on one mast); horizontal wind shear in knots per 1000 ft."},{"id":"S17-2","s":17,"topic":"Flight Hazards","tag":"WIND SHEAR · JET STREAM","code":"050 09 03 02","text":"The greatest wind shear associated with a jet stream is found:","options":["On the cold-air side, just below the core","On the warm-air side, well above the core","Exactly at the centre of the core","Near the surface, below the jet axis"],"correct":0,"explain":"Maximum shear lies on the cold (polar) side of the jet, just below the core; a secondary area lies above the core, extending into the stratosphere."},{"id":"S17-3","s":17,"topic":"Flight Hazards","tag":"DOWNBURSTS · EFFECTS","code":"050 09 04 04","text":"On approach, an aircraft enters a microburst. The first effect is usually:","options":["An increasing tailwind and loss of IAS","A strong downdraft with no change in IAS","An increasing headwind — IAS increases and the aircraft goes above the glide path","A sudden rise in outside air temperature"],"correct":2,"explain":"The outflow first gives an increasing headwind (IAS up, above the path). The downdraft and the dangerous increasing tailwind follow — reducing thrust in the first phase makes it worse."},{"id":"S17-4","s":17,"topic":"Flight Hazards","tag":"THUNDERSTORMS · CONDITIONS","code":"050 09 04 01","text":"For thunderstorms to develop, the lapse rate must exceed the SALR through a layer at least:","options":["3000 ft thick, below the freezing level","10,000 ft thick, extending above the freezing level","1000 ft thick, anywhere in the troposphere","30,000 ft thick, up to the tropopause"],"correct":1,"explain":"Instability (ELR > SALR) through a layer at least 10,000 ft thick extending above the freezing level, plus enough moisture and a trigger action."},{"id":"S17-5","s":17,"topic":"Flight Hazards","tag":"THUNDERSTORMS · LIFE CYCLE","code":"050 09 04 02","text":"The mature stage of a single-cell thunderstorm begins when:","options":["Precipitation starts to fall from the cloud","The anvil spreads out at the tropopause","Several small cumulus merge into one cell","The updrafts first reach 1000 fpm"],"correct":0,"explain":"Precipitation marks the mature stage: rain and hail drag air down, creating downdrafts alongside the updrafts, a gust front and the strongest hazards."},{"id":"S17-6","s":17,"topic":"Flight Hazards","tag":"THUNDERSTORMS · SUPERCELL","code":"050 09 04 02","text":"In the Northern Hemisphere, a supercell thunderstorm usually moves:","options":["With the 10,000 ft (700 hPa) wind","About 20° to the right of the 18,000 ft (500 hPa) wind","About 20° to the left of the surface wind","Very little — it is quasi-stationary"],"correct":1,"explain":"Single cells move with the 700 hPa wind; supercells in the Northern Hemisphere usually move about 20° to the right of the 500 hPa wind."},{"id":"S17-7","s":17,"topic":"Flight Hazards","tag":"THUNDERSTORMS · ELECTRICAL DISCHARGES","code":"050 09 04 03","text":"Lightning strikes on aircraft are most likely:","options":["Above FL 450 only","In clear air, far away from any Cb","Within about 5000 ft of the freezing level, between +10°C and −10°C","At temperatures below −40°C"],"correct":2,"explain":"Strikes are most likely within ± 5000 ft of the freezing level, at temperatures between +10°C and −10°C — most often between 0°C and −10°C."},{"id":"S17-8","s":17,"topic":"Flight Hazards","tag":"THUNDERSTORM AVOIDANCE · RADAR","code":"050 09 04 05","text":"Using airborne weather radar at FL 280, the recommended avoidance range from a thunderstorm echo is:","options":["5 NM","10 NM","20 NM","15 NM"],"correct":3,"explain":"FL 0–200: 5 NM (10 NM if growing rapidly) · FL 200–250: 10 NM · FL 250–300: 15 NM · above FL 300: 20 NM."},{"id":"S17-9","s":17,"topic":"Flight Hazards","tag":"MOUNTAINS · VALLEY INVERSION","code":"050 09 08 03","text":"A valley inversion typically forms:","options":["With strong winds and an overcast sky","Behind a fast-moving cold front","On clear, calm nights as cold air drains into the valley floor","Only on summer afternoons"],"correct":2,"explain":"Terrestrial radiation cools the slopes; cold dense air drains down and pools on the valley floor under warmer air — frost and fog are likely."},{"id":"S17-10","s":17,"topic":"Flight Hazards","tag":"VISIBILITY · OBSCURATIONS","code":"050 09 09 01","text":"Visibility 800 m, water droplets, relative humidity near 100%. This is:","options":["Mist","Fog","Haze","Smoke"],"correct":1,"explain":"Fog: visibility below 1000 m with water droplets (RH near 100%). Mist is 1000 m or more with RH above 95%; haze consists of solid particles."},{"id":"S18-1","s":18,"topic":"Met. Information — Observation","tag":"SURFACE OBSERVATIONS · WIND","code":"050 10 01 01","text":"The surface wind reported in a METAR is measured at a standard height of:","options":["2 m above the ground, inside the thermometer screen","1.25 m above short grass","On the control tower roof, whatever its height","10 m above the ground"],"correct":3,"explain":"Surface wind is measured by an anemometer and wind vane on a 10 m mast (10-minute mean). The 1.25–2 m height applies to the temperature screen."},{"id":"S18-2","s":18,"topic":"Met. Information — Observation","tag":"SURFACE OBSERVATIONS · CLOUD","code":"050 10 01 01","text":"At an aerodrome, the height of the cloud base is measured by a:","options":["Ceilometer","Transmissometer","Hygrometer","Anemometer"],"correct":0,"explain":"A ceilometer (laser cloud-base recorder) measures cloud base. The transmissometer measures RVR, the hygrometer humidity and the anemometer wind speed."},{"id":"S18-3","s":18,"topic":"Met. Information — Observation","tag":"RADIOSONDE · UPPER WINDS","code":"050 10 01 02","text":"A radiosonde transmits pressure, temperature and humidity. Upper winds are obtained by:","options":["An anemometer carried under the balloon","The pressure difference between two ascents","Tracking the position of the sonde by GPS or radio direction finding","Doppler radar echoes from the balloon"],"correct":2,"explain":"The sonde drifts with the wind; tracking its position (GPS or radio direction-finding antenna) gives wind speed and direction at each level."},{"id":"S18-4","s":18,"topic":"Met. Information — Observation","tag":"SATELLITES · POLAR ORBIT","code":"050 10 01 03","text":"A polar orbiting meteorological satellite (e.g. NOAA):","options":["Orbits at 36 000 km above the Equator","Orbits at about 850 km — good picture definition but no continuous view","Gives a continuous picture of one third of the Earth","Completes one orbit every 24 hours"],"correct":1,"explain":"Polar orbiters fly at 820–870 km, inclined 99°, one orbit in 1 h 42 min: high definition but only periodic snapshots of a given area."},{"id":"S18-5","s":18,"topic":"Met. Information — Observation","tag":"SATELLITES · GEOSTATIONARY","code":"050 10 01 03","text":"The main disadvantage of geostationary satellite imagery is:","options":["Picture distortion towards the poles","Images are only available at night","No time-lapse sequence is possible","Each orbit lies further west than the previous one"],"correct":0,"explain":"From 36 000 km over the Equator the view of high latitudes is very oblique, so pictures distort towards the poles. Coverage is continuous and time-lapse is a key strength."},{"id":"S18-6","s":18,"topic":"Met. Information — Observation","tag":"SATELLITES · INFRARED","code":"050 10 01 03","text":"On an infrared (IR) satellite image, the whitest areas show:","options":["The warmest land surfaces","The coldest, highest cloud tops","Thick low stratus","Fog banks"],"correct":1,"explain":"IR brightness depends on temperature: cold (high) cloud tops appear white, low cloud darker grey and warm land dark."},{"id":"S18-7","s":18,"topic":"Met. Information — Observation","tag":"SATELLITES · FOG","code":"050 10 01 03","text":"Why can fog be difficult to identify on an IR satellite picture?","options":["Fog reflects too much sunlight","Fog always appears brilliant white","The fog top has almost the same temperature as the underlying surface","IR pictures are not available at night"],"correct":2,"explain":"With little temperature contrast between fog top and sea or land, fog is nearly invisible on IR. By day, the visible image shows it clearly."},{"id":"S18-8","s":18,"topic":"Met. Information — Observation","tag":"WEATHER RADAR · PRINCIPLE","code":"050 10 01 04","text":"The intensity of an airborne weather radar echo depends mainly on:","options":["The intensity of the turbulence","The cloud-top temperature","The lightning activity in the cell","The size, composition and quantity of the water droplets"],"correct":3,"explain":"Radar detects reflectivity of precipitation: larger, liquid and more numerous drops give stronger echoes. Echo strength is NOT an indication of turbulence."},{"id":"S18-9","s":18,"topic":"Met. Information — Observation","tag":"WEATHER RADAR · AVOIDANCE","code":"050 10 01 04","text":"Using airborne radar at FL 260, the recommended minimum distance from a thunderstorm echo is:","options":["5 NM","10 NM","15 NM","20 NM"],"correct":2,"explain":"FL 0–200: 5 NM (10 NM if growing rapidly) · FL 200–250: 10 NM · FL 250–300: 15 NM · above FL 300: 20 NM."},{"id":"S18-10","s":18,"topic":"Met. Information — Observation","tag":"AIRCRAFT OBSERVATIONS · SPECIAL","code":"050 10 01 05","text":"Which encounter requires a special air-report (ARS)?","options":["Light icing in stratocumulus","Severe mountain wave","Light turbulence in cirrus","A steady crosswind on climb-out"],"correct":1,"explain":"Special air-reports: moderate/severe turbulence or icing, severe mountain wave, obscured/embedded/widespread TS or squall lines, heavy DS/SS, volcanic ash or activity."},{"id":"S19-1","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"SIGWX · WAFS","code":"050 10 02 01","text":"WAFC SIGWX charts are:","options":["Valid for 6 hours after the time of issue","Plots of observed significant weather","Issued only once a day","Fixed-time charts, valid only at the time stated on the chart"],"correct":3,"explain":"SIGWX charts are fixed-time prognostic charts, issued every 6 h, usually 18–24 h in advance, and valid only at the stated time."},{"id":"S19-2","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"SIGWX · CB COVERAGE","code":"050 10 02 01","text":"On a SIGWX chart, OCNL CB means cumulonimbus that are:","options":["Well separated, covering 50–75% of the area","Isolated, covering less than 50% of the area","Embedded in layer cloud","Forming a squall line"],"correct":0,"explain":"ISOL < 50% · OCNL 50–75% (well separated) · FRQ > 75% · EMBD hidden in cloud layers · SQL squall line."},{"id":"S19-3","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"UPPER AIR CHARTS","code":"050 10 02 03","text":"Which constant-pressure chart is closest to FL300 in the ISA?","options":["500 hPa","700 hPa","300 hPa","850 hPa"],"correct":2,"explain":"ISA: 850 hPa ≈ FL050, 700 ≈ FL100, 500 ≈ FL180, 300 ≈ FL300, 200 ≈ FL390."},{"id":"S19-4","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"METAR · WIND","code":"050 10 03 01","text":"In a METAR, 36010G20KT 300V060 is correct, but the variation group would NOT be reported if:","options":["The gust were 25 kt","The mean speed were 3 kt or less","The direction were 350°","The report were AUTO"],"correct":1,"explain":"Variations of 60°–179° are reported only when the mean speed is above 3 kt; at 3 kt or less the wind is reported as VRB."},{"id":"S19-5","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"METAR · RVR","code":"050 10 03 01","text":"R27/P1500 in a METAR means:","options":["RVR on runway 27 is more than 1500 m","RVR on runway 27 is less than 1500 m","Visibility 1500 m towards runway 27","RVR on runway 27 increasing to 1500 m"],"correct":0,"explain":"P = above the maximum reportable value (1500 m); M = below the minimum (50 m). U / D / N give the 10-minute tendency."},{"id":"S19-6","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"METAR · CAVOK","code":"050 10 03 01","text":"Which of the following does NOT prevent the use of CAVOK?","options":["Visibility 8 km","QNH 995 hPa","TCU over the aerodrome","Cloud SCT at 3000 ft (MSA 2500 ft)"],"correct":1,"explain":"CAVOK requires visibility ≥ 10 km, no cloud below 5000 ft or highest MSA, no CB/TCU and no significant weather. Pressure is irrelevant."},{"id":"S19-7","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"TAF · CHANGE GROUPS","code":"050 10 03 01","text":"In a TAF, TEMPO 1412/1416 0800 FG means fog is expected:","options":["Permanently from 1600 UTC","With 40% probability","At times between 12 and 16 UTC, each spell < 1 h, in total < half the period","From 1412 UTC for exactly 4 hours"],"correct":2,"explain":"TEMPO: temporary fluctuations, each lasting less than 1 h and together less than half of the period; conditions then return to the previous ones."},{"id":"S19-8","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"TAF · FM","code":"050 10 03 01","text":"FM131220 in a TAF indicates:","options":["A gradual change between 12 and 20 UTC","A probability of 12%","A temporary change lasting 20 minutes","A rapid change: a complete new forecast from the 13th at 1220 UTC"],"correct":3,"explain":"FM introduces a complete new set of conditions (wind, visibility, weather, cloud) that supersedes the previous forecast."},{"id":"S19-9","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"SIGMET · AIRMET","code":"050 10 03 01","text":"An AIRMET is issued for moderate icing affecting:","options":["All flights at any level","Supersonic flights only","Low-level flights below FL100 (FL150 in mountainous areas)","Aircraft parked on the aerodrome"],"correct":2,"explain":"AIRMET covers moderate phenomena for low-level flights not already in the GAMET; SIGMET covers severe phenomena at all levels."},{"id":"S19-10","s":19,"topic":"Met. Information — Charts, Messages & Services","tag":"BROADCASTS · ATIS","code":"050 10 03 02","text":"The surface wind broadcast on ATIS is given in:","options":["Degrees true, 10-minute mean","Degrees magnetic","Grid degrees","Metres per second only"],"correct":1,"explain":"ATIS and tower winds are magnetic (runway reference). METAR, TAF and VOLMET winds are in degrees true."}];</script>

<body>
<div class="top"><div class="brand">KSA <em>21</em> · METEO DUEL</div><div class="crew" id="c-name"></div><div class="muted" id="c-mem"></div><div class="sp"></div><span class="pts" id="c-pts"></span><div class="clock" id="c-clock"></div><span class="conn" id="c-conn"></span></div>
<main id="main"><div class="big"><div class="ic">⏳</div><h1>Connecting…</h1></div></main>
<script>
'use strict';
const esc = KSAPP.esc, P = KSAPP.params();
let SC = null, DB = null, ST = {}, GRP = {}, STU = {}, BOARD = {}, MYANS = null;
const GID = (P.g || '').toUpperCase();
const A = {};
const L = k => String.fromCharCode(65 + k);
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) { e.preventDefault(); A[b.dataset.a](b, e); } });
const M = h => document.getElementById('main').innerHTML = h;
const now = () => DB.now();
const ME = () => GRP[GID] || {};
const gname = g => (GRP[g] || {}).name || g;
const UI = { step: 1, pick: null, sig: '', sess: '', find: '', built: '' };
const IMG = {};
const SESS = [...new Map(KSA_BANK.map(q => [q.s, q.topic])).entries()];
const TYPE = t => t === 'CHART' ? '<span class="pill key">CHART + CODE</span>' : '<span class="pill k">QUESTION</span>';

(async function init() {
  if (GID === 'ALL') return allCrews();
  if (!P.s || !GID) return M(`<div class="big"><h1>Open this page from the crew QR code</h1><p class="muted">(needs ?s=SESSION&g=G1)</p></div>`);
  try { DB = await KSADB.open(P.s, P.mode === 'local' ? 'local' : 'firebase'); } catch (e) { return M(`<div class="big"><h1>Connection failed</h1><p>${esc(e.message)}</p></div>`); }
  SC = await DB.get('pub/config');
  if (!SC) return M(`<div class="big"><h1>Session ${esc(DB.code)} not found</h1></div>`);
  DB.connected(on => { const c = document.getElementById('c-conn'); c.textContent = on ? '●' : '● offline'; c.className = 'conn ' + (on ? 'on' : 'off'); });
  DB.on('state', v => { ST = v || {}; watchItem(); render(); });
  DB.on('groups', v => { GRP = v || {}; if (ME().step && !UI.stepSet) { UI.step = ME().step; UI.stepSet = true; } head(); conflicts(); render(); });
  DB.on('students', v => { STU = v || {}; head(); });
  DB.on('board', v => { BOARD = v || {}; head(); render(); });
  document.addEventListener('paste', onPaste);

// ════════════════════════════════════════════════════════════════════════
// PREPARATION GUIDE — 4 steps
// ════════════════════════════════════════════════════════════════════════
const DRAFT = {};
const chOf = i => ((ME().ch || {})[i]) || null;
function draft(i) { if (!DRAFT[i]) DRAFT[i] = JSON.parse(JSON.stringify(chOf(i) || {})); const d = DRAFT[i]; d.options = d.options || ['', '', '', '']; return d; }
const cidOf = i => GID + '-' + i;
const svT = {};
function save(i) { clearTimeout(svT[i]); svT[i] = setTimeout(() => DB.set(`groups/${GID}/ch/${i}`, DRAFT[i]), 400); upd(); }
function flush() { Object.keys(svT).forEach(i => { clearTimeout(svT[i]); if (DRAFT[i]) DB.set(`groups/${GID}/ch/${i}`, DRAFT[i]); }); }
const okSlot = i => !KSAD.validateChallenge(SC, draft(i), KSAD.slots(SC)[i]).length;
const STEPS = ['Choose 2 questions', 'Check & edit', 'Chart challenge', 'Review & send'];
function stepper() {
  const done = [DRAFT[0] && DRAFT[1] && (draft(0).stem || draft(0).src) && (draft(1).stem || draft(1).src), okSlot(0) && okSlot(1), okSlot(2), false];
  return `<div class="row between"><h1>Prepare your 3 challenges</h1><div class="clock" style="font-size:1.6rem" data-left></div></div>
    <div class="steps">${STEPS.map((s, k) => `<div class="${UI.step === k + 1 ? 'on' : done[k] && k + 1 < UI.step ? 'done' : ''}"><b>${done[k] && k + 1 < UI.step ? '✓' : k + 1}</b>${s}</div>`).join('')}</div>`;
}
function go(n) { flush(); UI.step = n; UI.built = ''; DB.update(`groups/${GID}`, { step: n }); draw(); window.scrollTo(0, 0); }
A.next = () => go(UI.step + 1);
A.back = () => go(UI.step - 1);
function guide() {
  const sig = UI.step + '|' + (UI.step === 1 ? JSON.stringify([UI.sess, UI.find, taken(), [0, 1].map(i => draft(i).src || (draft(i).own ? 'own' : ''))]) : '');
  if (UI.built === sig) { upd(); return; }
  UI.built = sig;
  M(stepper() + [step1, step2, step3, step4][UI.step - 1]());
  wire();
  loadImgs();
  upd();
}
// ── step 1: choose ──
function taken() { const t = {}; Object.entries(GRP).forEach(([g, G]) => Object.values(G.ch || {}).forEach(c => { if (c && c.src) t[c.src] = g; })); [0, 1].forEach(i => { if (DRAFT[i] && DRAFT[i].src) t[DRAFT[i].src] = GID; }); return t; }
function step1() {
  const tk = taken(), f = UI.find.toLowerCase();

  const slot = i => { const d = draft(i); return d.src || d.own ? `<div class="pick full"><div class="row between"><span class="lbl">Question ${i + 1}</span><span class="row"><span class="pill">${d.src ? esc(d.src) : '✍ our own'}</span><button class="btn sm" data-a="unpick" data-i="${i}">✕</button></span></div><div style="margin-top:6px;font-weight:700">${esc(d.stem || (d.own ? '(to be written in step 2)' : ''))}</div></div>`

  const full = [0, 1].every(i => draft(i).src || draft(i).own);
  return `<p class="lead">Pick <b>2 questions</b> from the end-of-session quizzes. In the next step you can change them (wording, options, numbers) — changed questions are harder for the other crews. Each question can be used by one crew only.</p>
    <div class="lay"><div><div class="row" style="margin-bottom:8px"><select data-ui="sess" style="width:auto"><option value="">All sessions</option>${SESS.map(([n, t]) => `<option value="${n}" ${String(UI.sess) === String(n) ? 'selected' : ''}>Session ${String(n).padStart(2, '0')} — ${esc(t)}</option>`).join('')}</select><input data-ui="find" placeholder="🔍 search…" value="${esc(UI.find)}" style="max-width:260px"><span class="muted">${list.length} questions</span></div>
      <div class="bank">${list.map(q => { const by = tk[q.id]; return `<div class="bq ${by ? 'used' : ''}"><div class="row between"><span class="muted">S${String(q.s).padStart(2, '0')} · ${esc(q.tag)}</span>${by ? `<span class="pill">${by === GID ? 'chosen' : 'used by ' + esc(gname(by))}</span>` : `<button class="btn sm pri" data-a="use" data-q="${q.id}" ${full ? 'disabled' : ''}>＋ Use</button>`}</div><div class="t">${esc(q.text)}</div><ol type="A">${q.options.map((o, k) => `<li class="${k === q.correct ? 'c' : ''}">${esc(o)}</li>`).join('')}</ol></div>`; }).join('') || '<div class="empty">No question found</div>'}</div></div>
    <div>${slot(0)}${slot(1)}<div class="nav"><span class="sp"></span><button class="btn go lg" data-a="next" ${full ? '' : 'disabled'}>Next ▶</button></div></div></div>`;

A.use = b => { const q = KSA_BANK.find(x => x.id === b.dataset.q); const i = [0, 1].find(k => !draft(k).src && !draft(k).own); if (i === undefined || !q) return;

/** two crews picked the same bank question at the same moment: the first one keeps it */

A.unpick = b => { const i = +b.dataset.i; DRAFT[i] = { options: ['', '', '', ''] }; DB.set(`groups/${GID}/ch/${i}`, null); if (draft(i).hasImg) DB.remove('img/' + cidOf(i)); UI.built = ''; draw(); };

    else body = `${qWithOpts(qd, qd.options.map((o, k) => `<button class="o ${UI.pick === k ? 'sel' : ''}" data-a="pick" data-k="${k}"><span class="L">${L(k)}</span>${esc(o)}</button>`).join(''))}
      <div class="nav"><span class="muted">Time left <b data-left></b></span><span class="sp"></span><button class="btn go lg" data-a="answer" ${UI.pick === null ? 'disabled' : ''}>Submit ▶</button></div>`;
    body += `<div class="tbar"><div data-bar></div></div>`;
  } else if (d.stage === 'explain') {
    const key = d.key || {}, it = (BOARD.items || {})[qd.cid] || { rows: {} }, r = it.rows[GID];
    const ban = mine ? `<div class="ban mine">🎤 YOUR crew explains the answer now — <span data-left></span> · ${Object.values(it.rows).filter(x => !x.ok).length} crew(s) missed → +${it.authorPts || 0}</div>` : r ? `<div class="ban ${r.ok ? 'stand' : 'void'}">${r.ok ? '✓ Right +' + SC.game.right : '✗ Wrong'} — listen to ${esc(gname(qd.author))}'s explanation</div>` : `<div class="ban contest">Listen to ${esc(gname(qd.author))}'s explanation</div>`;
    body = ban + qWithOpts(qd, qd.options.map((o, k) => `<button class="o ${k === key.correct ? 'right' : MYANS && +MYANS.k === k ? 'wrong' : ''}" disabled><span class="L">${L(k)}</span>${esc(o)}</button>`).join(''));
  }
  M(`<div class="lay"><div>${body}</div><div>${boardHTML()}</div></div>`);
  loadImgs(); tick();
}
function ownKey(cid) { const ch = chOf(cid.split('-')[1]) || {}; return `<div class="just"><b>Correct: ${L(+ch.correct)}</b> — ${esc(ch.options ? ch.options[ch.correct] : '')}</div>`; }
A.pick = b => { UI.pick = +b.dataset.k; document.querySelectorAll('.o[data-a=pick]').forEach(x => x.classList.toggle('sel', x === b)); const s = document.querySelector('[data-a=answer]'); if (s) s.disabled = false; };
A.answer = async () => {
  const d = ST.duel || {}; if (d.stage !== 'read' || MYANS || UI.pick === null) return;
  MYANS = { k: UI.pick, t: now() };
  await DB.set(`ans/${d.q.cid}/${GID}`, MYANS); UI.sig = ''; render();
};
function resultsHTML() {
  const it = Object.values(BOARD.items || {});
  const mine = it.filter(x => x.valid && x.rows && x.rows[GID]), own = it.filter(x => x.author === GID);
  return `<div class="lay" style="margin-top:20px"><div class="card"><h2>${esc(ME().name || GID)} — summary</h2><table class="t">
    <tr><td>Challenges of the other crews answered right</td><td><b>${mine.filter(x => x.rows[GID].ok).length} / ${mine.length}</b></td></tr>
    <tr><td>Own challenges played</td><td><b>${own.length}</b> · missed by the others ${own.reduce((a, x) => a + Object.values(x.rows).filter(r => !r.ok).length, 0)} times</td></tr>
    <tr><td>Game points</td><td><b>${(BOARD.game || {})[GID] ?? 0}</b></td></tr></table><p class="muted" style="margin-top:8px">Your individual K/S/A profile is on your phone.</p></div>${boardHTML()}</div>`;
}
function tick() {
  if (!ST.phase) return;
  const t = ST.hold || now();
  const ends = ST.phase === 'build' ? (ST.build || {}).endsAt : ST.phase === 'duel' ? (ST.duel || {}).endsAt : ST.phase === 'break' ? ST.breakEnds : ST.phase === 'peer' ? ST.peerEnds : null;
  const c = document.getElementById('c-clock');
  if (ends) { const left = ends - t; c.textContent = (ST.hold ? '⏸ ' : '') + KSAPP.fmt(Math.max(0, left)); c.className = 'clock ' + KSAPP.clockClass(left, 300000); document.querySelectorAll('[data-left]').forEach(e => e.textContent = KSAPP.fmt(Math.max(0, left))); }
  else c.textContent = '';
  const d = ST.duel || {};
  if (ST.phase === 'duel' && d.endsAt) document.querySelectorAll('[data-bar]').forEach(b => b.style.width = Math.max(0, Math.min(100, (d.endsAt - t) / Math.max(1, d.endsAt - d.at) * 100)) + '%');
  if (ST.phase === 'build' && !ME().locked && ends && t > ends - 1500) flush();
}
</script>
</body>
