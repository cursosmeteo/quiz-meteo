<style>
/* KSA ENGINE — shared theme for teacher / group / student pages */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg2:#0f1520;--bg3:#161e30;--bg4:#1f2a42;--line:#2a3650;--line2:#3a4a6a;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;
  --text:#e8edf5;--text2:#9fb0c8;--text3:#5d7090;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.2)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--blue)}
textarea{resize:vertical}
.mono{font-family:var(--mono)}
.btn{border:1px solid var(--line2);background:var(--bg3);color:var(--text);border-radius:8px;padding:8px 14px;font-size:.88rem;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--blue);background:var(--bg4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#052e12}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#2a1700}
.btn.sm{padding:4px 10px;font-size:.78rem}
.btn.lg{padding:12px 22px;font-size:1rem}
.btn.ghost{background:transparent}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--text3);font-size:.82rem}
.lbl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg4);color:var(--text2);white-space:nowrap}
.pill.k{background:rgba(59,130,246,.18);color:#93c5fd}.pill.s{background:rgba(34,197,94,.18);color:#86efac}.pill.a{background:rgba(168,85,247,.18);color:#d8b4fe}
.pill.key{background:rgba(245,158,11,.18);color:#fcd34d}.pill.ind{background:rgba(6,182,212,.18);color:#67e8f9}
.pill.ok{background:rgba(34,197,94,.18);color:#86efac}.pill.no{background:rgba(239,68,68,.18);color:#fca5a5}.pill.wait{background:rgba(245,158,11,.15);color:#fcd34d}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--text3)}
.clock{font-family:var(--mono);font-weight:800;letter-spacing:.02em}
.clock.low{color:var(--amber)}.clock.out{color:var(--red)}

/* KSA bars */
.ksa{display:flex;flex-direction:column;gap:5px;min-width:180px}
.ksa .b{display:grid;grid-template-columns:16px 1fr 48px;gap:7px;align-items:center;font-size:.78rem;font-weight:700}
.ksa .tr{height:7px;background:var(--bg4);border-radius:99px;overflow:hidden}
.ksa .fi{height:100%;border-radius:99px;transition:width .6s}
.ksa .k .fi{background:var(--blue)}.ksa .s .fi{background:var(--green)}.ksa .a .fi{background:var(--purple)}
.ksa .k b{color:#93c5fd}.ksa .s b{color:#86efac}.ksa .a b{color:#d8b4fe}
.ksa .v{text-align:right;font-family:var(--mono);color:var(--text2)}
.ksa .tot{font-size:.78rem;color:var(--text2);text-align:right}

/* modal / toast / viewer */
.modal{position:fixed;inset:0;background:rgba(2,6,15,.86);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:min(1100px,100%);max-height:94vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal .mh b{flex:1}
.modal .mb{padding:14px;overflow:auto}
.viewer img{display:block;max-width:100%;margin:auto;background:#fff;cursor:zoom-in}
.viewer.full img{max-width:none;cursor:zoom-out}
.viewer pre{font:600 .95rem/1.6 var(--mono);white-space:pre-wrap;background:#0b1220;padding:14px;border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--line2);padding:10px 18px;border-radius:10px;font-weight:650;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* library list */
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-it{display:flex;gap:10px;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;text-align:left;color:var(--text)}
.lib-it:hover{border-color:var(--cyan)}
.lib-it .th{width:56px;height:40px;border-radius:5px;background:#fff center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.lib-it .th.t{background:#0b1220;color:var(--cyan);font-weight:800;font-size:.62rem}
.lib-it b{font-size:.85rem;display:block}
.lib-it span{font-size:.72rem;color:var(--text3)}

/* disclaimer */
.disc{max-width:820px;margin:18px auto 0;font-size:.8rem;line-height:1.55;color:var(--text2);border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.06);border-radius:10px;padding:10px 14px;text-align:left}
.disc b{color:#fbbf24}
/* route result table */
table.rt{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
table.rt th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.rt td{padding:4px 6px;border-bottom:1px solid rgba(42,54,80,.6);vertical-align:middle}
table.rt td:first-child{color:var(--text2);font-weight:600;width:38%}
table.rt input{padding:5px 7px;font-size:.88rem}
table.rt.show td{font-size:1.05rem;padding:7px 9px}
table.rt.show td:not(:first-child){color:var(--text);font-weight:650}
/* status bar */
.conn{font-size:.72rem;font-weight:700}
.conn.on{color:var(--green)}.conn.off{color:var(--red)}


.btn.pri:hover:not(:disabled){background:#2563eb;border-color:#2563eb}.btn.go:hover:not(:disabled){background:#16a34a;border-color:#16a34a}.btn.warn:hover:not(:disabled){background:#d97706;border-color:#d97706}

<script>/*!
 * KSA DUEL — ksa-duel.js
 * Core of the "Meteo Duel" KSA exercise (ATPL 050 Meteorology · Session 21).
 *  - pre-test speed scoring (end-of-session quiz rules) and crew formation (best + last)
 *  - syllabus areas per crew, challenge slots and validation
 *  - duel order, verdicts of contested challenges, game points
 *  - K / S / A scores
 * Carlos Paizinho · cursos.meteo@gmail.com · Developed with Claude (Anthropic)
 */
(function (root) {
'use strict';

// ── pre-test: +6 … +1 by speed (5-second steps), wrong −4, no answer −2 ──
function quizPoints(correct, answered, secs) {
  if (!answered) return -2;
  if (!correct) return -4;
  return Math.max(1, 6 - Math.floor(Math.max(0, secs) / 5));
}
function gradePretest(questions, answers, starts) {
  let pts = 0, correct = 0;
  questions.forEach((q, i) => {
    const a = answers ? answers[i] : undefined;
    const answered = a !== undefined && a !== null && a.k !== undefined;
    const ok = answered && +a.k === +q.correct;
    const secs = answered && starts && starts[i] ? (a.t - starts[i]) / 1000 : 30;
    pts += quizPoints(ok, answered, secs);
    if (ok) correct++;
  });
  return { pts, correct, n: questions.length, max: 6 * questions.length };
}
/** ranked = ids best → worst; each crew takes ⌈size/2⌉ from the top and the rest from the bottom */
function formGroupsTopBottom(ranked, nGroups) {
  const n = ranked.length; nGroups = Math.max(1, Math.min(nGroups, n));
  const sizes = Array.from({ length: nGroups }, (_, g) => Math.floor(n / nGroups) + (g < n % nGroups ? 1 : 0));
  let i = 0, j = n - 1;
  return sizes.map(sz => {
    const g = []; const top = Math.ceil(sz / 2);
    for (let k = 0; k < top; k++) g.push(ranked[i++]);
    for (let k = top; k < sz; k++) g.push(ranked[j--]);
    return g;
  });
}
/** crews of 2 to 4 (5 only if unavoidable): ⌈n/4⌉, at least 2 */
function autoGroupCount(n) { if (n < 4) return 1; return Math.max(2, Math.ceil(n / 4)); }

// ── areas & slots ─────────────────────────────────────────────────────
/** two different areas per crew, spread over the syllabus (random start, then cyclic) */
function assignAreas(SC, nGroups, rnd) {
  const ids = SC.areas.map(a => a.id);
  const r = rnd || Math.random;
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const out = [];
  for (let g = 0; g < nGroups; g++) out.push([ids[(2 * g) % ids.length], ids[(2 * g + 1) % ids.length]]);
  return out;
}
function slotsFor(SC, nGroups) { return nGroups <= 4 ? SC.build.slots4 : SC.build.slots3; }
/** slot code → description */
function slotInfo(SC, code, areas) {
  const lab = id => (SC.areas.find(a => a.id === id) || {}).label || id;
  if (code === 'A') return { type: 'THEORY', areas: [areas[0]], title: 'Theory — ' + lab(areas[0]) };
  if (code === 'B') return { type: 'THEORY', areas: [areas[1]], title: 'Theory — ' + lab(areas[1]) };
  if (code === 'AB') return { type: 'THEORY', areas: areas.slice(), title: 'Theory — either of your two areas' };
  return { type: 'OPS', areas: SC.areas.map(a => a.id), title: 'Operational — a situation you create (METAR / TAF / SIGMET / chart reading) and a decision' };
}
/** list of problems that prevent a challenge from being played ([] = ready) */
function validateChallenge(SC, ch, info) {
  const p = [];
  ch = ch || {};
  const txt = v => String(v || '').trim();
  if (txt(ch.stem).length < 12) p.push('question');
  const opts = (ch.options || []).map(txt);
  if (opts.length < 4 || opts.slice(0, 4).some(o => !o)) p.push('4 options');
  else if (new Set(opts.slice(0, 4).map(o => o.toLowerCase())).size < 4) p.push('options must differ');
  if (!(ch.correct >= 0 && ch.correct <= 3)) p.push('correct option');
  if (txt(ch.just).length < (SC.build.minJustification || 30)) p.push('justification (≥ ' + (SC.build.minJustification || 30) + ' characters)');
  if (info.type === 'OPS' && txt(ch.data).length < 10) p.push('data block (METAR / TAF / SIGMET / situation)');
  if (info.type === 'THEORY' && info.areas.length > 1 && !info.areas.includes(ch.area)) p.push('choose the area');
  return p;
}

// ── duel order: round-robin by crew, slot by slot ─────────────────────
function buildOrder(SC, groups) {
  const gids = Object.keys(groups || {}).sort();
  const lists = gids.map(g => {
    const G = groups[g], slots = slotsFor(SC, gids.length);
    return slots.map((code, i) => ({ cid: g + '-' + i, g, i, code, info: slotInfo(SC, code, G.areas || []), ch: (G.ch || {})[i] }))
      .filter(x => validateChallenge(SC, x.ch, x.info).length === 0)
      .map(x => x.cid);
  });
  const out = []; let more = true;
  for (let r = 0; more; r++) { more = false; lists.forEach(l => { if (l[r]) { out.push(l[r]); more = true; } }); }
  // avoid two consecutive challenges by the same crew where possible (already guaranteed by round-robin)
  return out;
}
function challengeOf(groups, cid) { const [g, i] = String(cid).split('-'); return (((groups || {})[g] || {}).ch || {})[i] || null; }

// ── confidence (bet) → calibration (Brier) ────────────────────────────
const CONF = { 1: 0.4, 2: 0.65, 3: 0.9 };
function brier(bet, ok) { const p = CONF[bet] || CONF[1]; return 1 - Math.pow(p - (ok ? 1 : 0), 2); }

/**
 * verdict of one played challenge.
 * D.duel = { ans:{cid:{gid:{k,bet,t}}}, contest:{cid:{gid:true}}, vote:{cid:{sid:'valid'|'flawed'}} }
 * D.override = {cid:'valid'|'void'}
 * returns { status:'valid'|'void', contested, contesters[], votes:{valid,flawed}, pending, by:'jury'|'teacher'|'' }
 */
function verdict(SC, D, cid) {
  const author = cid.split('-')[0];
  const ans = ((D.duel || {}).ans || {})[cid] || {};
  const ch = challengeOf(D.groups, cid) || {};
  const contesters = Object.keys(((D.duel || {}).contest || {})[cid] || {}).filter(g => g !== author && ans[g] && +ans[g].k !== +ch.correct);
  const votes = { valid: 0, flawed: 0 };
  const neutral = sid => { const s = (D.students || {})[sid]; return s && s.group && s.group !== author && !contesters.includes(s.group); };
  Object.entries(((D.duel || {}).vote || {})[cid] || {}).forEach(([sid, v]) => { if (neutral(sid) && votes[v] !== undefined) votes[v]++; });
  const hasNeutral = Object.values(D.students || {}).some(s => s.group && s.group !== author && !contesters.includes(s.group));
  let status = 'valid', by = '', pending = false;
  if (contesters.length) {
    if (!hasNeutral) pending = true;
    else { by = 'jury'; if (votes.flawed > votes.valid) status = 'void'; }
  }
  const ov = (D.override || {})[cid];
  if (ov === 'void' || ov === 'valid') { status = ov; by = 'teacher'; pending = false; }
  return { status, contested: contesters.length > 0, contesters, votes, pending, by };
}

/**
 * full results: game points per crew, per-challenge table, K/S/A per student.
 * D = { students, groups, duel:{ans,contest,vote}, played:[cid], override, quality:{cid:1..3}, peer }
 */
function compute(SC, D) {
  const gids = Object.keys(D.groups || {}).sort();
  const G = SC.game, played = D.played || [];
  const game = {}; gids.forEach(g => game[g] = 0);
  const per = {};                     // gid → {th:[ok], ops:[ok], cal:[score]}
  gids.forEach(g => per[g] = { th: [], ops: [], cal: [], design: [] });
  const items = {};
  played.forEach(cid => {
    const author = cid.split('-')[0], ch = challengeOf(D.groups, cid); if (!ch || !game.hasOwnProperty(author)) return;
    const [, i] = cid.split('-');
    const info = slotInfo(SC, slotsFor(SC, gids.length)[+i] || 'A', (D.groups[author] || {}).areas || []);
    const ans = ((D.duel || {}).ans || {})[cid] || {};
    const v = verdict(SC, D, cid);
    const rows = {}; let right = 0, wrong = 0;
    gids.filter(g => g !== author).forEach(g => {
      const a = ans[g], answered = !!a && a.k !== undefined && a.k !== null, ok = answered && +a.k === +ch.correct;
      const bet = answered ? Math.max(1, Math.min(3, +a.bet || 1)) : 0;
      let pts = 0;
      if (v.status === 'valid') {
        pts = answered ? (ok ? bet : -bet) : G.noAnswer;
        if (v.contesters.includes(g)) pts += G.contestLost;
        (info.type === 'OPS' ? per[g].ops : per[g].th).push(ok ? 1 : 0);
        if (answered) per[g].cal.push(brier(bet, ok));
      } else if (v.contesters.includes(g)) pts = G.contestWon;
      if (ok) right++; else wrong++;
      game[g] += pts;
      rows[g] = { k: answered ? +a.k : null, bet, ok, pts, contested: v.contesters.includes(g) };
    });
    let apts = 0;
    if (v.status === 'valid') apts = G.authorPerMiss * wrong; else apts = G.annulAuthor;
    game[author] += apts;
    const disc = right > 0 && wrong > 0;
    const q = (D.quality || {})[cid];
    const design = v.status === 'void' ? 0 : q ? (q - 1) / 2 : 0.6 + (disc ? 0.4 : 0);
    items[cid] = { cid, author, type: info.type, area: ch.area || info.areas[0], verdict: v, rows, right, wrong, authorPts: apts, disc, design };
  });
  // design score per crew: every slot counts; an incomplete slot = 0; a complete slot not played (time) is left out
  gids.forEach(g => {

  setInterval(tick, 500);
})();
function head() {
  const G = ME();
  document.getElementById('c-name').textContent = G.name || GID;
  document.getElementById('c-mem').textContent = (G.members || []).map(id => (STU[id] || {}).name || '').join(' · ');
  const p = (BOARD.game || {})[GID]; document.getElementById('c-pts').textContent = p !== undefined ? p + ' pts' : '';
}
// answers / contest of the current challenge
let unA = null, unC = null, watched = null;
function watchItem() {
  const cid = ((ST.duel || {}).q || {}).cid || null;
  if (cid === watched) return;
  watched = cid; if (unA) unA(); if (unC) unC(); MYANS = null; MYCON = null; UI.bet = null; UI.pick = null;
  if (!cid) return;
  unA = DB.on(`duel/ans/${cid}/${GID}`, v => { MYANS = v; render(); });
  unC = DB.on(`duel/contest/${cid}/${GID}`, v => { MYCON = v; render(); });
}
let rT = null;
function render() { if (rT) return; rT = setTimeout(() => { rT = null; draw(); }, 120); }
function draw() {
  if (!ST.phase || !SC) return;
  const G = ME();
  if (!G.members && !['lobby', 'pretest'].includes(ST.phase)) return M(`<div class="big"><h1>${esc(GID)} does not exist in this session</h1></div>`);
  const ph = ST.phase;
  if (ph === 'build' && !G.locked) return buildView();
  UI.built = false;
  if (ph === 'lobby' || ph === 'pretest') return M(`<div class="big"><div class="ic">📱</div><h1>Pre-test on the phones</h1><p class="muted">The crews are formed after the pre-test. Keep this laptop open.</p></div>`);
  if (ph === 'groups') return M(`<div class="big"><div class="ic">👥</div><h1>${esc(G.name)}</h1><p style="font-size:1.1rem">${(G.members || []).map(id => esc((STU[id] || {}).name || '')).join(' · ')}</p>
    <p class="muted" style="margin-top:14px">Your two areas</p><p style="font-size:1.1rem">${(G.areas || []).map(a => `<b>${esc(a)}</b> — ${esc(areaLabel(a))}`).join('<br>')}</p><p class="muted" style="margin-top:14px">Round 1 starts in a moment: you will write your challenges here.</p></div>`);
  if (ph === 'build') return M(`<div class="big"><div class="ic">🔒</div><h1>Challenges locked</h1><p class="muted">Wait for the other crews. The duel starts when everyone has locked or the time is up.</p></div>`);
  if (ph === 'duel') return duelView();
  if (ph === 'break') return M(`<div class="big"><div class="ic">☕</div><h1>Break</h1><p class="muted">Peer assessment on the phones after the break.</p></div>${resultsHTML()}`);
  if (ph === 'peer') return M(`<div class="big"><div class="ic">📱</div><h1>Peer assessment on the phones</h1></div>${resultsHTML()}`);
  if (ph === 'debrief') return M(`<h1>Debriefing</h1>${resultsHTML()}`);
}

// ════════════════════════════════════════════════════════════════════════
// ROUND 1 — BUILD
// ════════════════════════════════════════════════════════════════════════
function slots() { const G = ME(); return KSAD.slotsFor(SC, Object.keys(GRP).length).map((code, i) => ({ i, code, info: KSAD.slotInfo(SC, code, G.areas || []) })); }
function chOf(i) { return ((ME().ch || {})[i]) || {}; }
const DRAFT = {};       // local copy while typing (the database copy may lag behind)
function draft(i) { if (!DRAFT[i]) DRAFT[i] = JSON.parse(JSON.stringify(chOf(i))); const d = DRAFT[i]; d.options = d.options || ['', '', '', '']; return d; }
function buildView() {
  const S = slots();
  if (UI.built && UI.builtTab === UI.tab) { updIssues(); return; }
  UI.built = true; UI.builtTab = UI.tab;
  const s = S[UI.tab], d = draft(s.i);
  const areaSel = s.info.type === 'THEORY' && s.info.areas.length > 1 ? `<label><span>Area</span><select data-f="area"><option value="">— choose —</option>${s.info.areas.map(a => `<option value="${a}" ${d.area === a ? 'selected' : ''}>${esc(a)} — ${esc(areaLabel(a))}</option>`).join('')}</select></label>` : '';
  M(`<div class="row between"><h1>Round 1 — build your challenges</h1><div class="muted">${(ME().areas || []).map(a => `<b>${esc(a)}</b> ${esc(areaLabel(a))}`).join(' · ')}</div></div>
   <div class="tabsx">${S.map((x, k) => `<button class="${k === UI.tab ? 'on' : ''}" data-a="tab" data-k="${k}">${k + 1} · ${x.info.type === 'OPS' ? 'Operational' : 'Theory'} <span class="d" data-dot="${k}"></span></button>`).join('')}</div>
   <div class="grid bgrid" style="grid-template-columns:minmax(0,1fr) 300px;gap:16px"><div class="card form">
     <div><span class="pill ${s.info.type === 'OPS' ? 'key' : 'k'}">${s.info.type === 'OPS' ? 'OPERATIONAL' : 'THEORY'}</span> <b>${esc(s.info.title)}</b></div>
     ${areaSel}
     ${s.info.type === 'OPS' ? `<label><span>Data block — the situation you create (METAR, TAF, SIGMET, wind/temp, chart description…)</span><textarea class="data" rows="4" data-f="data" placeholder="METAR LPPT 211030Z 34018G30KT 3000 +SHRA BKN008 FEW020CB 14/12 Q1008 TEMPO 1200 TSRA">${esc(d.data || '')}</textarea></label>` : `<label><span>Data block (optional)</span><textarea class="data" rows="2" data-f="data" placeholder="optional: a code or values the question refers to">${esc(d.data || '')}</textarea></label>`}
     <label><span>Question</span><textarea rows="2" data-f="stem" placeholder="${s.info.type === 'OPS' ? 'e.g. You are the commander of a flight to LPPT, ETA 1130Z. What is the best decision?' : 'Write the question'}">${esc(d.stem || '')}</textarea></label>
     <div><span class="lbl" style="color:var(--text3)">Options — click the letter of the correct one</span>${[0, 1, 2, 3].map(k => `<div class="oprow" style="margin-top:6px"><span class="rad ${+d.correct === k && d.correct !== undefined && d.correct !== null && d.correct !== '' ? 'on' : ''}" data-a="cor" data-k="${k}">${L(k)}</span><input data-o="${k}" value="${esc(d.options[k] || '')}" autocomplete="off"></div>`).join('')}</div>
     <label><span>Justification — why the correct option is right (and the others wrong). You will defend it if contested.</span><textarea rows="3" data-f="just">${esc(d.just || '')}</textarea></label>
     <label><span>Source (optional) — session, book page, question-bank reference</span><input data-f="ref" value="${esc(d.ref || '')}"></label>
     <div class="issues" id="iss"></div>
   </div><div>
     <div class="card" style="text-align:center"><div class="muted">Time left</div><div class="clock" style="font-size:2.4rem" data-left></div></div>
     <div class="hintbox" style="margin-top:12px"><b>Good challenges</b><br>• one clear idea, unambiguous wording<br>• plausible wrong options (typical misconceptions)<br>• a challenge that <b>some</b> crews get right and others not scores best for you<br>• the operational one: a realistic situation and a <b>decision</b> (go / delay / divert / change FL…)<br>• a flawed challenge can be annulled by the jury: author −3</div>
     <button class="btn go lg" style="width:100%;margin-top:12px" data-a="lock">🔒 Lock all challenges</button>
     <p class="muted" style="margin-top:6px">Saved automatically. When the time is up everything is locked; incomplete challenges are not played and count 0 for the quality of your challenges.</p>
   </div></div>`);
  const root = document.getElementById('main');
  root.querySelectorAll('[data-f]').forEach(el => el.addEventListener('input', () => { d[el.dataset.f] = el.value; save(s.i); }));
  root.querySelectorAll('select[data-f]').forEach(el => el.addEventListener('change', () => { d[el.dataset.f] = el.value; save(s.i); }));
  root.querySelectorAll('[data-o]').forEach(el => el.addEventListener('input', () => { d.options[+el.dataset.o] = el.value; save(s.i); }));
  updIssues();
}
const svT = {};
function save(i) { updIssues(); clearTimeout(svT[i]); svT[i] = setTimeout(() => DB.set(`groups/${GID}/ch/${i}`, DRAFT[i]), 500); }
function updIssues() {
  const S = slots();
  S.forEach((s, k) => { const d = DRAFT[s.i] || chOf(s.i); const ok = !KSAD.validateChallenge(SC, d, s.info).length; const dot = document.querySelector(`[data-dot="${k}"]`); if (dot) dot.classList.toggle('ok', ok); });
  const s = S[UI.tab], iss = document.getElementById('iss'); if (!iss) return;
  const p = KSAD.validateChallenge(SC, draft(s.i), s.info);
  iss.className = 'issues' + (p.length ? '' : ' ok'); iss.textContent = p.length ? 'Missing: ' + p.join(' · ') : '✓ Ready to be played';
}
A.tab = b => { flush(); UI.tab = +b.dataset.k; UI.built = false; draw(); };
A.cor = b => { const s = slots()[UI.tab], d = draft(s.i); d.correct = +b.dataset.k; document.querySelectorAll('.rad').forEach(x => x.classList.toggle('on', x === b)); save(s.i); };
function flush() { Object.keys(svT).forEach(i => { clearTimeout(svT[i]); if (DRAFT[i]) DB.set(`groups/${GID}/ch/${i}`, DRAFT[i]); }); }
A.lock = async () => {
  const S = slots(), bad = S.filter(s => KSAD.validateChallenge(SC, DRAFT[s.i] || chOf(s.i), s.info).length);
  if (!confirm(bad.length ? `${bad.length} challenge(s) incomplete — they will NOT be played. Lock anyway?` : 'Lock all challenges? You cannot change them afterwards.')) return;
  flush(); await DB.update(`groups/${GID}`, { locked: true, lockedAt: now() });
};

// ════════════════════════════════════════════════════════════════════════
// ROUND 2 — DUEL
// ════════════════════════════════════════════════════════════════════════
function boardHTML() {
  const rows = Object.keys(GRP).sort().map(g => [g, (BOARD.game || {})[g] || 0]).sort((a, b) => b[1] - a[1]);
  return `<div class="card board"><div class="lbl" style="margin-bottom:8px">Scoreboard</div>${rows.map(([g, p]) => `<div class="r ${g === GID ? 'me' : ''}">${esc(gname(g))}<span class="p">${p}</span></div>`).join('')}</div>`;
}
function qBlock(qd, key, mine) {
  return `<div class="row"><span class="lbl">Challenge ${qd.n} / ${qd.N}</span><span class="pill ${qd.type === 'OPS' ? 'key' : 'k'}">${qd.type === 'OPS' ? 'OPERATIONAL' : 'THEORY'}</span><span class="pill ind">${esc(qd.area)}</span><span class="pill">by ${esc(gname(qd.author))}</span></div>
    <div class="q">${esc(qd.stem)}</div>${qd.data ? `<div class="qdata">${esc(qd.data)}</div>` : ''}`;
}
function duelView() {
  const d = ST.duel || {}, qd = d.q, mine = qd && qd.author === GID;
  const sig = JSON.stringify([d.stage, d.i, !!MYANS, MYCON, (BOARD.items || {})[qd && qd.cid], BOARD.game]);
  if (sig === UI.sig && d.stage === 'read' && !MYANS) return;      // keep the selection while answering
  UI.sig = sig;
  let body = '';
  if (d.stage === 'intro') body = `<div class="big" style="margin-top:6vh"><div class="ic">⚔</div><h1>The duel starts in <span data-left></span></h1><p class="muted">For each challenge of the other crews: discuss quickly, choose your <b>bet</b> (1–3) and your answer, then submit. Right +bet · wrong −bet · no answer ${SC.game.noAnswer}.</p></div>`;
  else if (d.stage === 'end') body = `<div class="big" style="margin-top:6vh"><div class="ic">🏁</div><h1>End of the duel</h1><p class="muted">Break next.</p></div>`;
  else if (!qd) body = '';
  else if (d.stage === 'read') {
    if (mine) body = `<div class="ban mine">This is YOUR challenge — do not answer. Prepare your defence in case it is contested.</div>${qBlock(qd)}${ownKey(qd.cid)}<div class="tbar"><div data-bar></div></div>`;
    else if (MYANS) body = `<div class="ban mine">Answer locked: <b>${L(MYANS.k)}</b> · bet ×${MYANS.bet}</div>${qBlock(qd)}<div class="opts">${qd.options.map((o, k) => `<button class="o ${+MYANS.k === k ? 'sel' : ''}" disabled><span class="L">${L(k)}</span>${esc(o)}</button>`).join('')}</div><div class="tbar"><div data-bar></div></div>`;
    else body = `${qBlock(qd)}<div class="opts">${qd.options.map((o, k) => `<button class="o ${UI.pick === k ? 'sel' : ''}" data-a="pick" data-k="${k}"><span class="L">${L(k)}</span>${esc(o)}</button>`).join('')}</div>
      <div class="bets"><b>Bet</b>${[1, 2, 3].map(b => `<button class="${UI.bet === b ? 'on' : ''}" data-a="bet" data-b="${b}">×${b}</button>`).join('')}<span class="muted">${{ 1: 'unsure', 2: 'fairly sure', 3: 'certain' }[UI.bet] || 'choose how sure you are'}</span><span class="sp"></span><button class="btn go lg" data-a="send" ${UI.pick === null || !UI.bet ? 'disabled' : ''}>Submit ▶</button></div>
      <div class="tbar"><div data-bar></div></div><p class="muted" style="margin-top:6px">Time left <b data-left></b></p>`;
  } else {
    const key = d.key || {}, it = (BOARD.items || {})[qd.cid] || { rows: {} }, r = it.rows[GID];
    const wrong = !mine && MYANS && +MYANS.k !== +key.correct;
    let ban = '';
    if (d.stage === 'reveal') ban = mine ? `<div class="ban mine">Your challenge: ${Object.values(it.rows).filter(x => !x.ok).length} crew(s) missed → +${it.authorPts || 0}</div>` : r ? `<div class="ban ${r.ok ? 'stand' : 'void'}">${r.ok ? '✓ Right' : '✗ Wrong'} · ${r.pts > 0 ? '+' : ''}${r.pts} pts</div>` : '';
    if (d.stage === 'defend') ban = `<div class="ban contest">⚖ Contested — ${mine ? 'YOUR spokesperson defends now (60″)' : 'the author crew defends (60″)'}</div>`;
    if (d.stage === 'counter') ban = `<div class="ban contest">⚖ ${MYCON ? 'YOUR spokesperson argues now (60″) — why is it flawed?' : 'The contesting crew argues (60″)'}</div>`;
    if (d.stage === 'vote') ban = `<div class="ban contest">🗳 The neutral crews vote on their phones</div>`;
    if (d.stage === 'verdict') ban = it.pending ? `<div class="ban contest">No jury available — the instructor decides in the debriefing</div>` : it.status === 'void' ? `<div class="ban void">❌ Challenge annulled</div>` : `<div class="ban stand">✅ Challenge stands</div>`;
    const contest = d.stage === 'reveal' && wrong ? (MYCON ? `<div class="ban contest">⚖ You contested this challenge — prepare one spokesperson (60″)</div>` : `<div class="card" style="margin-top:12px;border-color:var(--amber)"><div class="row between"><div><b>Do you think the challenge is flawed?</b><div class="muted">Ambiguous, technically wrong, two right options… Won: +${SC.game.contestWon} · lost: ${SC.game.contestLost}. Decide fast — <b data-left></b></div></div><button class="btn warn lg" data-a="contest">⚖ Contest</button></div></div>`) : '';
    body = ban + qBlock(qd) + `<div class="opts">${qd.options.map((o, k) => `<button class="o ${k === key.correct ? 'right' : MYANS && +MYANS.k === k ? 'wrong' : ''}" disabled><span class="L">${L(k)}</span>${esc(o)}</button>`).join('')}</div>${key.just ? `<div class="just"><b>Justification —</b> ${esc(key.just)}</div>` : ''}${contest}${['defend', 'counter', 'vote'].includes(d.stage) ? `<p class="muted" style="margin-top:8px">Time left <b data-left></b></p>` : ''}`;
  }
  M(`<div class="lay"><div>${body}</div><div>${boardHTML()}</div></div>`);
  tick();
}
function ownKey(cid) { const [, i] = cid.split('-'); const ch = chOf(i); return `<div class="just"><b>Correct: ${L(+ch.correct)}</b> — ${esc(ch.just || '')}</div>`; }
A.pick = b => { UI.pick = +b.dataset.k; document.querySelectorAll('.o[data-a=pick]').forEach(x => x.classList.toggle('sel', x === b)); enableSend(); };
A.bet = b => { UI.bet = +b.dataset.b; document.querySelectorAll('[data-a=bet]').forEach(x => x.classList.toggle('on', x === b)); const m = b.parentElement.querySelector('.muted'); if (m) m.textContent = { 1: 'unsure', 2: 'fairly sure', 3: 'certain' }[UI.bet]; enableSend(); };
function enableSend() { const s = document.querySelector('[data-a=send]'); if (s) s.disabled = UI.pick === null || !UI.bet; }
A.send = async () => {
  const d = ST.duel || {}; if (d.stage !== 'read' || MYANS || UI.pick === null || !UI.bet) return;
  MYANS = { k: UI.pick, bet: UI.bet, t: now() };
  await DB.set(`duel/ans/${d.q.cid}/${GID}`, MYANS); UI.sig = ''; render();
};
A.contest = async () => {
  const d = ST.duel || {}; if (d.stage !== 'reveal') return;
  if (!confirm('Contest this challenge? One spokesperson will argue for 60″; the neutral crews decide.')) return;
  await DB.set(`duel/contest/${d.q.cid}/${GID}`, true);
};

// ── results after the duel ──
function resultsHTML() {
  const it = Object.values(BOARD.items || {});
  const mine = it.filter(x => x.rows && x.rows[GID]);
  const right = mine.filter(x => x.status === 'valid' && x.rows[GID].ok).length, tot = mine.filter(x => x.status === 'valid').length;
  const own = it.filter(x => x.author === GID);
  return `<div class="lay" style="margin-top:20px"><div class="card"><h2>${esc(ME().name || GID)} — summary</h2><table class="t">
    <tr><td>Challenges of the others answered right</td><td><b>${right} / ${tot}</b></td></tr>
    <tr><td>Own challenges played</td><td><b>${own.length}</b> · missed by the others ${own.reduce((a, x) => a + Object.values(x.rows).filter(r => !r.ok).length, 0)} times · annulled ${own.filter(x => x.status === 'void').length}</td></tr>
    <tr><td>Game points</td><td><b>${(BOARD.game || {})[GID] ?? 0}</b></td></tr></table><p class="muted" style="margin-top:8px">Your individual K/S/A profile is on your phone.</p></div>${boardHTML()}</div>`;
}
function tick() {
  if (!ST.phase) return;
  const t = ST.hold || now();
  const ends = ST.phase === 'build' ? (ST.build || {}).endsAt : ST.phase === 'duel' ? (ST.duel || {}).endsAt : ST.phase === 'break' ? ST.breakEnds : ST.phase === 'peer' ? ST.peerEnds : null;
  const c = document.getElementById('c-clock');
  if (ends) { const left = ends - t; c.textContent = ST.hold ? '⏸ ' + KSAPP.fmt(Math.max(0, left)) : KSAPP.fmt(Math.max(0, left)); c.className = 'clock ' + KSAPP.clockClass(left, 300000); document.querySelectorAll('[data-left]').forEach(e => e.textContent = KSAPP.fmt(Math.max(0, left))); }
  else c.textContent = '';
  const d = ST.duel || {};
  if (ST.phase === 'duel' && d.endsAt) document.querySelectorAll('[data-bar]').forEach(b => b.style.width = Math.max(0, Math.min(100, (d.endsAt - t) / Math.max(1, d.endsAt - d.at) * 100)) + '%');
  if (ST.phase === 'build' && !ME().locked && ends && t > ends - 1500) flush();
}
</script>
</body>
</html>
