<script>/*!
 * KSA DUEL — ksa-duel.js  (simple version, first classroom test)
 * ATPL 050 Meteorology · Session 21
 *  - pre-test speed scoring (end-of-session quiz rules) and crew formation (best + last)
 *  - 3 challenges per crew: 2 from the question bank (editable) + 1 chart challenge (chart + related code)
 *  - duel order, game points (right +1 · author +1 per miss), K / S / A
 * Carlos Paizinho · cursos.meteo@gmail.com · Developed with Claude (Anthropic)
 */
(function (root) {
'use strict';

function quizPoints(correct, answered, secs) {
  if (!answered) return -2;
  if (!correct) return -4;
  return Math.max(1, 6 - Math.floor(Math.max(0, secs) / 5));
}
function gradePretest(questions, answers, starts) {
  let pts = 0, correct = 0;
  questions.forEach((q, i) => {
    const a = answers ? answers[i] : undefined;
    const answered = a !== undefined && a !== null && a.k !== undefined;
    const ok = answered && +a.k === +q.correct;
    const secs = answered && starts && starts[i] ? (a.t - starts[i]) / 1000 : 30;
    pts += quizPoints(ok, answered, secs);
    if (ok) correct++;
  });
  return { pts, correct, n: questions.length, max: 6 * questions.length };
}
/** ranked = ids best → worst; each crew takes ⌈size/2⌉ from the top and the rest from the bottom */
function formGroupsTopBottom(ranked, nGroups) {
  const n = ranked.length; nGroups = Math.max(1, Math.min(nGroups, n));
  const sizes = Array.from({ length: nGroups }, (_, g) => Math.floor(n / nGroups) + (g < n % nGroups ? 1 : 0));
  let i = 0, j = n - 1;
  return sizes.map(sz => {
    const g = []; const top = Math.ceil(sz / 2);
    for (let k = 0; k < top; k++) g.push(ranked[i++]);
    for (let k = top; k < sz; k++) g.push(ranked[j--]);
    return g;
  });
}
function autoGroupCount(n) { if (n < 4) return 1; return Math.max(2, Math.ceil(n / 4)); }

// ── challenges ─────────────────────────────────────────────────────────
function slots(SC) { return SC.build.slots; }
function typeOf(SC, cid) { return slots(SC)[+String(cid).split('-')[1]] || 'BANK'; }
/** problems that prevent a challenge from being played ([] = ready) */
function validateChallenge(SC, ch, type, hasImg) {
  const p = []; ch = ch || {};
  const txt = v => String(v || '').trim();
  if (txt(ch.stem).length < 8) p.push('question');
  const opts = (ch.options || []).slice(0, 4).map(txt);
  if (opts.length < 4 || opts.some(o => !o)) p.push('4 options');
  else if (new Set(opts.map(o => o.toLowerCase())).size < 4) p.push('options must differ');
  if (!(ch.correct >= 0 && ch.correct <= 3)) p.push('correct option');
  if (type === 'CHART') {
    if (!ch.chart) p.push('type of chart');
    if (!(hasImg || ch.hasImg)) p.push('chart image');
    if (txt(ch.code).length < 8) p.push('code (METAR / TAF / SIGMET)');
  }
  return p;
}
function buildOrder(SC, groups) {
  const gids = Object.keys(groups || {}).sort();
  const lists = gids.map(g => slots(SC).map((t, i) => ({ cid: g + '-' + i, t, ch: ((groups[g] || {}).ch || {})[i] }))
    .filter(x => validateChallenge(SC, x.ch, x.t).length === 0).map(x => x.cid));
  const out = []; let more = true;
  for (let r = 0; more; r++) { more = false; lists.forEach(l => { if (l[r]) { out.push(l[r]); more = true; } }); }
  return out;
}
function challengeOf(groups, cid) { const [g, i] = String(cid).split('-'); return (((groups || {})[g] || {}).ch || {})[i] || null; }
/** was a bank question changed by the crew? */
function edited(ch, bank) {
  if (!ch || !ch.src) return 'own';
  const b = (bank || []).find(q => q.id === ch.src); if (!b) return 'own';
  const same = String(ch.stem || '').trim() === b.text.trim() && (ch.options || []).every((o, k) => String(o || '').trim() === String(b.options[k] || '').trim()) && +ch.correct === +b.correct;
  return same ? 'bank' : 'edited';
}

/**
 * results: game points per crew, per-challenge table, K/S/A per student.
 * D = { students, groups, ans:{cid:{gid:{k,t}}}, played:[cid], override:{cid:'void'}, quality:{cid:1..3}, peer }
 */
function compute(SC, D) {
  const gids = Object.keys(D.groups || {}).sort();
  const G = SC.game, played = D.played || [];
  const game = {}; gids.forEach(g => game[g] = 0);
  const per = {}; gids.forEach(g => per[g] = { bank: [], chart: [], design: [] });
  const items = {};
  played.forEach(cid => {
    const author = cid.split('-')[0], ch = challengeOf(D.groups, cid); if (!ch || !game.hasOwnProperty(author)) return;
    const type = typeOf(SC, cid), ans = (D.ans || {})[cid] || {};
    const valid = (D.override || {})[cid] !== 'void';
    const rows = {}; let right = 0, wrong = 0;
    gids.filter(g => g !== author).forEach(g => {
      const a = ans[g], answered = !!a && a.k !== undefined && a.k !== null, ok = answered && +a.k === +ch.correct;
      const pts = valid && ok ? G.right : 0;
      if (valid) { (type === 'CHART' ? per[g].chart : per[g].bank).push(ok ? 1 : 0); game[g] += pts; }
      if (ok) right++; else wrong++;
      rows[g] = { k: answered ? +a.k : null, ok, pts };
    });
    const apts = valid ? G.authorPerMiss * wrong : 0;
    game[author] += apts;
    const disc = right > 0 && wrong > 0, q = (D.quality || {})[cid];
    const design = !valid ? 0 : q ? (q - 1) / 2 : 0.6 + (disc ? 0.4 : 0);
    items[cid] = { cid, author, type, valid, rows, right, wrong, authorPts: apts, disc, design };
  });
  gids.forEach(g => slots(SC).forEach((t, i) => {
    const cid = g + '-' + i, it = items[cid];
    if (it) per[g].design.push(it.design);
    else if (validateChallenge(SC, ((D.groups[g] || {}).ch || {})[i], t).length) per[g].design.push(0);
  }));
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const W = SC.scoring.weights, sp = SC.scoring.split, pScale = +SC.peer.scale || 5;
  const ksa = {};
  Object.entries(D.students || {}).forEach(([sid, st]) => {
    const P = per[st.group] || { bank: [], chart: [], design: [] };
    const pre = st.pre && st.pre.max ? Math.max(0, Math.min(1, st.pre.pts / st.pre.max)) : null;
    const recv = []; Object.entries(D.peer || {}).forEach(([r, m]) => { if (r !== sid && m && m[sid]) { const v = Object.values(m[sid]).map(Number).filter(x => x > 0); if (v.length) recv.push(mean(v)); } });
    const peer = recv.length ? (mean(recv) - 1) / Math.max(1, pScale - 1) : null;
    const comp = { K: { pretest: pre, bank: mean(P.bank) }, S: { chart: mean(P.chart), design: mean(P.design) }, A: { peer } };
    const dim = {};

<script>window.KSA_BANK = [{"id":"S01-1","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · COMPOSITION","code":"050 01 01 01","text":"Which two gases make up approximately 99% of the dry atmosphere by volume?","options":["Oxygen (21%) and Carbon Dioxide (78%)","Nitrogen (78%) and Argon (21%)","Oxygen (78%) and Nitrogen (21%)","Nitrogen (78%) and Oxygen (21%)"],"correct":3,"explain":"Dry air is ~78% N₂ and ~21% O₂, with Argon at ~0.93% and CO₂ at ~0.04%. Together N₂ and O₂ account for ~99% of the dry atmosphere."},{"id":"S01-2","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · LAYERS","code":"050 01 01 02","text":"At what altitude does the ISA tropopause occur, and what is the temperature there?","options":["11 km / 36 090 ft · −56.5°C","20 km / 65 617 ft · −56.5°C","11 km / 36 090 ft · −57.5°C","8 km / 26 247 ft · −50°C"],"correct":0,"explain":"The ISA defines the tropopause at 11 km (36 090 ft) with a temperature of −56.5°C (216.65 K). These values are essential reference numbers for ATPL calculations."},{"id":"S01-3","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · TROPOSPHERE","code":"050 01 01 02","text":"What is the ISA environmental lapse rate (ELR) in the troposphere?","options":["+1.98°C / 1 000 ft (6.5°C/km)","+0.65°C / 1 000 ft (2°C/km)","+0.65°C / 100 m (6.5°C/km)","+1.00°C / 100 m (10°C/km)"],"correct":2,"explain":"The ISA ELR is 0.65°C per 100 m, equivalent to 6.5°C/km or approximately 2°C per 1 000 ft. Temperature decreases from +15°C at MSL to −56.5°C at the tropopause."},{"id":"S01-4","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · TROPOPAUSE","code":"050 01 01 02","text":"Where is the tropopause at its highest altitude?","options":["Over the poles in winter","Over the equator","Over mid-latitudes in summer","Over the poles in summer"],"correct":1,"explain":"Intense tropical convection pushes the tropopause to 16–18 km (54 000–57 000 ft) over the equator. At the poles it is only 8–10 km (31 000–35 000 ft)."},{"id":"S01-5","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · STRATOSPHERE","code":"050 01 01 03","text":"In the stratosphere (11–20 km), the lapse rate is described as:","options":["Zero — temperature is constant (isothermal)","Positive — temperature falls with altitude","Negative — temperature rises with altitude","Super-adiabatic — temperature rises rapidly"],"correct":0,"explain":"From 11 to 20 km the stratosphere is isothermal: temperature remains constant at −56.5°C. Above 20 km, O₃ absorption of UV causes temperature to rise (negative lapse rate), reaching ~0°C at 50 km."},{"id":"S01-6","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · OZONE","code":"050 01 01 03","text":"Ozone (O₃) concentrations at cruise altitude (FL300–FL410) are an aviation hazard because:","options":["They cause severe CAT near the tropopause","They reduce visibility below VMC minima","They freeze fuel systems at −56.5°C","Concentrations are hazardous to human health"],"correct":3,"explain":"At jet cruise levels the ozone layer peaks at 20–25 km. Concentrations can be hazardous to respiratory health; aircraft ECS systems include catalytic converters, and EASA sets regulatory limits."},{"id":"S01-7","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · LAYERS","code":"050 01 01 04","text":"In which layer does temperature decrease from 0°C to approximately −90°C?","options":["Stratosphere","Mesosphere","Thermosphere","Tropopause"],"correct":1,"explain":"The mesosphere extends from ~50 to 85 km. Temperature falls from ~0°C at the stratopause to roughly −90°C at the mesopause — the coldest region in the atmosphere. Meteors burn up in this layer."},{"id":"S01-8","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · TROPOSPHERE","code":"050 01 01 02","text":"The tropopause is lower in winter than in summer mainly because:","options":["Ozone absorbs more UV radiation in winter","Earth is further from the Sun in the Northern Hemisphere winter","Reduced solar heating leads to less convection, limiting troposphere height","Jet streams push the tropopause downward in winter"],"correct":2,"explain":"Less solar heating in winter means less convection. With weaker vertical mixing, the troposphere does not extend as high. At mid-latitudes this produces a ~1–2 km seasonal variation in tropopause height."},{"id":"S01-9","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · ISA","code":"050 01 02 02","text":"An aircraft at FL250 (7 620 m) reports OAT of −30°C. What is the ISA deviation?","options":["ISA − 10°C","ISA + 10°C","ISA − 5°C","ISA + 5°C"],"correct":1,"explain":"ISA temp at FL250 = +15 − (0.65 × 76.2) = +15 − 49.5 ≈ −34.5°C. OAT = −30°C. Deviation = −30 − (−34.5) = +4.5°C ≈ ISA+5. More precisely using 2°C/1 000 ft: 15 − (2 × 25) = −35°C; deviation = −30 − (−35) = +5°C → ISA+5."},{"id":"S01-10","s":1,"topic":"The Atmosphere","tag":"ATMOSPHERE · TROPOPAUSE","code":"050 01 01 02","text":"Which phenomena are typically associated with the tropopause? (Select the most complete answer)","options":["Jet streams, CAT, and maximum cloud tops","Jet streams, thunderstorm bases, and maximum wind","CAT, aurora borealis, and ozone peak","Maximum cloud tops, inversion layer, and ITCZ"],"correct":0,"explain":"The tropopause is characterised by jet streams (polar and subtropical), Clear Air Turbulence (CAT), and the maximum height of clouds. It also marks the boundary where the temperature lapse rate changes."},{"id":"S02-1","s":2,"topic":"Heat Transfer & Inversions","tag":"HEAT TRANSFER · PROCESSES","code":"050 01 02 03","text":"Which process is the main source of heating for the troposphere?","options":["Direct absorption of solar short-wave radiation","Conduction from the surface upward","Latent heat released by precipitation","Terrestrial long-wave radiation and convection"],"correct":3,"explain":"The troposphere is largely transparent to solar short-wave radiation. It is heated primarily by terrestrial (long-wave) radiation emitted from the surface, and by convection carrying warm air aloft."},{"id":"S02-2","s":2,"topic":"Heat Transfer & Inversions","tag":"HEAT TRANSFER · RADIATION","code":"050 01 02 03","text":"What is the wavelength range of terrestrial (long-wave) radiation?","options":["4 to 80 μm, peak at 10 μm","0.15 to 4 μm, peak at 0.5 μm","8 to 13 μm only (atmospheric window)","0.4 to 0.7 μm (visible spectrum)"],"correct":0,"explain":"Solar radiation is short-wave: 0.15–4 μm (peak ~0.5 μm). Terrestrial radiation is long-wave: 4–80 μm with peak at ~10 μm. The 8–13 μm atmospheric window allows some direct escape to space."},{"id":"S02-3","s":2,"topic":"Heat Transfer & Inversions","tag":"HEAT TRANSFER · GREENHOUSE EFFECT","code":"050 01 02 03","text":"Without greenhouse gases, the Earth's mean surface temperature would be approximately:","options":["+5°C","0°C","−18°C","−40°C"],"correct":2,"explain":"Without greenhouse gases (H₂O, CO₂, O₃, CH₄), the surface would be −18°C. The greenhouse effect adds ~+33°C, giving the observed mean of +15°C (ISA MSL value)."},{"id":"S02-4","s":2,"topic":"Heat Transfer & Inversions","tag":"HEAT TRANSFER · STRATOSPHERE","code":"050 01 02 03","text":"The stratosphere is heated mainly by:","options":["Convection rising from the troposphere","UV absorption by ozone (O₃)","Terrestrial radiation absorbed by CO₂","Latent heat release from cloud tops"],"correct":1,"explain":"Ozone (O₃) absorbs UV solar radiation in the 20–50 km layer. This is why stratospheric temperature increases with altitude above ~20 km — a negative lapse rate, unlike the troposphere."},{"id":"S02-5","s":2,"topic":"Heat Transfer & Inversions","tag":"INVERSIONS · RADIATION","code":"050 01 02 05","text":"A radiation inversion requires which set of conditions?","options":["Clear skies, light winds, night-time","Overcast skies, strong surface wind, daytime","High pressure, sinking air, mid-troposphere","Warm air overriding cold at a frontal surface"],"correct":0,"explain":"Radiation inversions form at night when the surface loses heat by IR emission. Clear skies allow maximum radiative cooling; light winds prevent turbulent mixing. Result: surface colder than air above → fog and frost risk, burns off after sunrise."},{"id":"S02-6","s":2,"topic":"Heat Transfer & Inversions","tag":"INVERSIONS · SUBSIDENCE","code":"050 01 02 05","text":"A subsidence inversion found in the mid-troposphere is associated with:","options":["A frontal surface where warm air overrides cold","Turbulent mixing at the top of the friction layer","Cold air draining into a valley at night","An anticyclone where sinking air warms adiabatically"],"correct":3,"explain":"In a high-pressure system (anticyclone), air subsides and warms adiabatically as it descends, creating a warm layer above cooler surface air — a mid-tropospheric inversion that traps pollutants, haze and smog below."},{"id":"S02-7","s":2,"topic":"Heat Transfer & Inversions","tag":"INVERSIONS · TURBULENCE","code":"050 01 02 05","text":"A turbulence inversion forms at the top of the friction layer (~2 000 ft) because:","options":["Solar radiation heats the air at that level preferentially","Turbulent mixing cools the layer below, leaving warmer air above","Cold air drainage pools at the friction layer boundary","Ozone absorption warms the air at 2 000 ft"],"correct":1,"explain":"Turbulent mixing in the friction layer cools and dries the air below. At the top of the mixing layer the turbulence ceases, leaving warmer, smoother air above — creating the turbulence inversion. Below: turbulent; above: smooth."},{"id":"S02-8","s":2,"topic":"Heat Transfer & Inversions","tag":"INSOLATION · DIURNAL CYCLE","code":"050 01 02 06","text":"On a clear day over land, maximum surface temperature typically occurs at:","options":["1200 LT — solar noon","1800 LT — sunset","1500 LT — 2 to 3 hours after solar noon","0900 LT — mid-morning"],"correct":2,"explain":"The Sun is highest at 1200 LT but the surface continues to receive net radiation for 2–3 more hours. T max occurs ~1500 LT. T min occurs just after sunrise when the night-time radiative loss ends. This 2–3 h lag is a key exam point."},{"id":"S02-9","s":2,"topic":"Heat Transfer & Inversions","tag":"INSOLATION · SURFACE EFFECTS","code":"050 01 02 06","text":"Radiation fog never forms over the open sea because:","options":["Sea water reflects most solar radiation (high albedo)","The sea surface diurnal temperature variation is less than 1°C","The sea surface is always above the dew point","Wind over the sea always prevents fog formation"],"correct":1,"explain":"Water has a high specific heat capacity, so the sea surface temperature varies less than 1°C diurnally. This tiny cooling is never sufficient to reach the dew point. Advection fog can form over the sea, but not radiation fog."},{"id":"S02-10","s":2,"topic":"Heat Transfer & Inversions","tag":"INVERSIONS · AVIATION","code":"050 01 02 05","text":"Which inversion type is most associated with CAT, icing and cloud tops marking the inversion level?","options":["Frontal inversion — warm air overriding cold","Radiation inversion — clear night, light winds","Subsidence inversion — mid-troposphere anticyclone","Valley inversion — cold air drainage"],"correct":0,"explain":"Frontal inversions occur where warm air overrides cold at the frontal surface. The inversion level is marked by cloud tops. Above: warm sector, smoother flight. The inversion layer itself brings CAT and icing — significant operational hazards."},{"id":"S03-1","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · DEFINITION","code":"050 01 03 00","text":"What is the standard sea-level pressure in the International Standard Atmosphere (ISA)?","options":["1000.0 hPa / 750 mmHg / 29.53 inHg","1013.25 hPa / 760 mmHg / 29.53 inHg","1000.0 hPa / 760 mmHg / 29.92 inHg","1013.25 hPa / 760 mmHg / 29.92 inHg"],"correct":3,"explain":"ISA MSL pressure is 1013.25 hPa = 760 mmHg = 29.92 inHg. Temperature = +15°C, density = 1.225 kg/m³. These are the three standard reference values at sea level."},{"id":"S03-2","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · VARIATION WITH HEIGHT","code":"050 01 03 02","text":"Approximately how much does pressure decrease per 30 ft near sea level?","options":["1 hPa","2 hPa","0.5 hPa","3 hPa"],"correct":0,"explain":"Near MSL, pressure decreases by approximately 1 hPa per 30 ft (or about 1 hPa per 9 m). This is the basis for altimeter operation and QNH/QFE calculations. The rate decreases with altitude as the air becomes less dense."},{"id":"S03-3","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · ALTIMETRY","code":"050 01 03 03","text":"An aircraft sets QNH on the altimeter. On the ground at the aerodrome, the altimeter reads:","options":["Zero feet — aerodrome is at MSL by definition","QFE pressure in hPa","The aerodrome elevation above MSL","Pressure altitude at FL000"],"correct":2,"explain":"QNH is the MSL pressure reduced using ISA conditions. When set on the altimeter, it reads aerodrome elevation on the ground. QFE gives a reading of zero on the ground. QNH is used for en-route flight; QFE for approach and landing."},{"id":"S03-4","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · QFE / QNH / QFF","code":"050 01 03 03","text":"QFF differs from QNH because it is reduced to MSL using:","options":["ISA temperature profile","Actual observed temperature at the station","A fixed lapse rate of 2°C/1000 ft","The temperature at the tropopause"],"correct":1,"explain":"QFF is the station pressure reduced to MSL using the actual temperature, not ISA. It is used on synoptic (weather) charts for isobars. QNH uses ISA temperature; QFF uses actual temperature — they differ when OAT ≠ ISA."},{"id":"S03-5","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · ISOBARS","code":"050 01 03 01","text":"Isobars on a surface chart are lines connecting points of equal:","options":["Pressure reduced to MSL","Temperature","Humidity","Pressure at station elevation"],"correct":0,"explain":"Isobars connect points of equal pressure reduced to MSL (QFF). They cannot use raw station pressure because stations are at different elevations. The spacing of isobars indicates the pressure gradient — closer = stronger wind."},{"id":"S03-6","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · BUYS BALLOT'S LAW","code":"050 01 03 01","text":"In the Northern Hemisphere, if you stand with your back to the wind, the lower pressure is:","options":["Behind you","In front of you","To your right","To your left"],"correct":3,"explain":"Buys Ballot's Law (NH): stand with your back to the wind → low pressure is to your LEFT. In the Southern Hemisphere it is reversed (to the right). The wind blows parallel to isobars due to the Coriolis force, not directly from high to low."},{"id":"S03-7","s":3,"topic":"Atmospheric Pressure & Density","tag":"DENSITY · IDEAL GAS LAW","code":"050 01 04 01","text":"Using the ideal gas law (ρ = P/RT), if temperature increases while pressure stays the same, air density:","options":["Increases — warmer air is denser","Decreases — warmer air expands and becomes less dense","Stays the same — only pressure affects density","First increases then decreases"],"correct":1,"explain":"ρ = P/(R·T). With P constant, ρ is inversely proportional to T. Higher T → lower ρ. This directly affects aircraft performance: hot day = less dense air = higher density altitude = worse performance."},{"id":"S03-8","s":3,"topic":"Atmospheric Pressure & Density","tag":"DENSITY · ALTITUDE & PERFORMANCE","code":"050 01 04 01","text":"Density altitude is defined as the altitude in the ISA at which the air density equals the observed density. A high density altitude means:","options":["Dense air and better engine performance","Dense air but reduced lift due to low temperature","Less dense air and degraded lift, thrust and propeller efficiency","The same as pressure altitude when ISA conditions exist"],"correct":2,"explain":"High DA = thin air = reduced engine power, less aerodynamic lift (wings need more speed), and less propeller efficiency. Results: longer take-off roll, reduced rate of climb, higher true airspeed for same IAS. Critical at hot, high-altitude airports."},{"id":"S03-9","s":3,"topic":"Atmospheric Pressure & Density","tag":"PRESSURE · ISOHYPSES","code":"050 01 03 02","text":"On a 500 hPa constant pressure chart, isohypses (contour lines) connect points of equal:","options":["Pressure at flight level 180","Height of the 500 hPa surface above MSL","Temperature on the 500 hPa surface","Wind speed on the 500 hPa chart"],"correct":1,"explain":"Isohypses on constant-pressure charts are equivalent to isobars on surface charts. They show the height (in metres or geopotential metres) at which the 500 hPa surface is found above MSL. High values = warm air below; low values = cold air. Closely spaced = strong upper winds."},{"id":"S03-10","s":3,"topic":"Atmospheric Pressure & Density","tag":"DENSITY · LATITUDE & TROPOPAUSE","code":"050 01 04 01","text":"At the same altitude above ~26 000 ft, which region has the highest air density?","options":["Equatorial regions — high tropopause means cold air extends higher","Polar regions — cold, denser air throughout","Mid-latitudes — where density is always standard ISA","Density is equal at all latitudes above 26 000 ft"],"correct":0,"explain":"The tropopause is ~16 km over the equator vs ~8 km over the poles. Above ~26 000 ft, the equator has colder air near its tropopause level, giving higher density. Below ~26 000 ft the relationship reverses — poles are colder and denser at the surface."},{"id":"S04-1","s":4,"topic":"ISA & Altimetry","tag":"ISA · DEFINITION","code":"050 01 05 00","text":"What is the ISA sea-level temperature and standard pressure?","options":["+15°C · 1000.0 hPa","+10°C · 1013.25 hPa","0°C · 1013.25 hPa","+15°C · 1013.25 hPa"],"correct":3,"explain":"ISA MSL: temperature = +15°C, pressure = 1013.25 hPa, density = 1.225 kg/m³. The lapse rate is 2°C per 1 000 ft up to the tropopause at FL360 (36 090 ft), above which temperature is constant at −56.5°C."},{"id":"S04-2","s":4,"topic":"ISA & Altimetry","tag":"ISA · LAPSE RATE & DEVIATION","code":"050 01 05 00","text":"At FL60, the ISA temperature is +3°C. The OAT is +13°C. The ISA deviation is:","options":["ISA + 10","ISA − 10","ISA − 3","ISA + 3"],"correct":0,"explain":"ISA at FL60 = 15 − (2×6) = +3°C. OAT = +13°C. Deviation = OAT − ISA = +13 − (+3) = +10°C = ISA +10. Positive deviation → air warmer than standard → density lower → performance degraded."},{"id":"S04-3","s":4,"topic":"ISA & Altimetry","tag":"ISA · PRESSURE GRADIENT","code":"050 01 05 00","text":"In the ATPL syllabus, the pressure gradient near sea level is approximately:","options":["1 hPa per 27 ft","1 hPa per 33 ft","1 hPa per 30 ft","2 hPa per 30 ft"],"correct":2,"explain":"ATPL syllabus: 1 hPa ≈ 30 ft near MSL (precise value: 27 ft). This is the basis for altimeter corrections: QNH = QFE + elevation(ft)/30, and for the 1 hPa sub-scale rule — 1 hPa error → ~30 ft altitude error."},{"id":"S04-4","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · QFE vs QNH","code":"050 01 06 02","text":"An aerodrome is 500 ft AMSL. With QFE set, the altimeter reads on the ground:","options":["500 ft (aerodrome elevation)","Zero (aerodrome surface)","1013 ft","Pressure altitude"],"correct":1,"explain":"QFE = aerodrome surface pressure → altimeter reads HEIGHT above aerodrome = zero on the ground. QNH = MSL-corrected pressure → altimeter reads ALTITUDE above MSL = 500 ft on the ground at this aerodrome."},{"id":"S04-5","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · STANDARD SETTING","code":"050 01 06 02","text":"Standard Altimeter Setting — SAS (SPS, QNE) = 1013.25 hPa. When set, the altimeter reads:","options":["Pressure altitude — Flight Level","Height above aerodrome (AGL)","Altitude above MSL (QNH)","True altitude"],"correct":0,"explain":"With SAS/SPS/QNE (1013.25 hPa) set, the altimeter reads PRESSURE ALTITUDE = Flight Level. All aircraft above the Transition Altitude use this common datum — guaranteeing vertical separation regardless of local pressure."},{"id":"S04-6","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · TRANSITION","code":"050 01 06 01","text":"Climbing through the Transition Altitude (TA), the pilot sets:","options":["QNH","QFE","Destination QNH","Standard — SAS (SPS, QNE) = 1013.25 hPa"],"correct":3,"explain":"Climbing through TA → set Standard (1013.25 hPa). Descending through TL → revert to QNH. Below TA: altitudes (QNH). Above TL: Flight Levels (Standard). Transition Layer = transit only, no cruising allowed."},{"id":"S04-7","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · TRANSITION LAYER","code":"050 01 06 01","text":"Within the Transition Layer (between TA and TL), aircraft may:","options":["Cruise at a constant Flight Level","Transit only — no cruising","Cruise at a constant Altitude","Use either QNH or 1013.25 hPa freely"],"correct":1,"explain":"No cruising in the Transition Layer — transit only. Lower QNH → higher TL → thicker layer. Climbing: set SAS at TA. Descending: set QNH at TL."},{"id":"S04-8","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · LOWEST USABLE FL","code":"050 01 06 01","text":"The area QNH is 982 hPa. Compared to a standard day (1013 hPa), the lowest usable flight level is:","options":["Lower — pressure drops with low QNH","Unchanged — QNH does not affect FLs","Higher — the 1013 datum is geometrically higher when QNH is low","Lower only above the Transition Level"],"correct":2,"explain":"FLs are fixed to the 1013.25 hPa surface. Low QNH → that surface sits at a higher geometric altitude → TL shifts up → lowest usable FL increases. QNH 982 hPa is ~31 hPa below standard → datum ~930 ft higher. Always verify before filing on a low-QNH day."},{"id":"S04-9","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · COLD TEMPERATURE","code":"050 01 06 01","text":"Flying from a warm to a cold region at constant indicated altitude, true altitude:","options":["Increases — cold air is denser","Decreases — aircraft is lower than indicated","Stays the same — altimeter corrects automatically","Depends only on QNH"],"correct":1,"explain":"'From High to Low — Watch Out Below.' Cold air is denser and compressed. The altimeter (assuming ISA) over-reads → true altitude is LOWER than indicated. Critical for terrain clearance and instrument approaches in cold-weather operations."},{"id":"S04-10","s":4,"topic":"ISA & Altimetry","tag":"ALTIMETRY · FORECAST QNH","code":"050 01 06 02","text":"Forecast QNH is the lowest expected QNH in the Altimeter Setting Region (ASR) for the next hour. Using it ensures:","options":["Actual altitude ≥ indicated altitude — safe for obstacle clearance","The altimeter over-reads — a built-in safety margin","It equals QFF at all times","Simpler calculation than current QNH"],"correct":0,"explain":"Forecast QNH = lowest expected pressure in the ASR. If actual pressure ≥ forecast QNH, altimeter reads conservatively low → actual altitude ≥ indicated → safe for terrain and obstacle clearance. QNH is always rounded DOWN for the same reason."},{"id":"S05-1","s":5,"topic":"Altimetry Calculations","tag":"ALTIMETRY · BAROMETRIC ERROR","code":"050 01 06 03","text":"Setting 1 020 hPa, actual QNH 1 010 hPa. Altimeter reads:","options":["300 ft LOW","Correct","300 ft HIGH","30 ft LOW"],"correct":3,"explain":"Error = (Setting − Actual) × 30 = (1020 − 1010) × 30 = +300 ft. Setting > QNH → altimeter reads HIGH. True altitude is 300 ft LOWER than shown."},{"id":"S05-2","s":5,"topic":"Altimetry Calculations","tag":"ALTIMETRY · QNH ON GROUND","code":"050 01 06 03","text":"On the ground with QNH set, the altimeter reads:","options":["Aerodrome elevation","Zero","Pressure altitude","Height AGL"],"correct":0,"explain":"QNH referenced to MSL → altimeter reads aerodrome ELEVATION above MSL on the ground. QFE → reads zero (height above aerodrome)."},{"id":"S05-3","s":5,"topic":"Altimetry Calculations","tag":"COLD TEMPERATURE ERROR","code":"050 01 06 03","text":"Cold air (T < ISA). Flying at constant indicated altitude, true altitude is:","options":["Higher than indicated","Equal to indicated","Lower than indicated","Depends on QNH only"],"correct":2,"explain":"Cold air → contracted column → pressure levels lower → altimeter over-reads. True alt < Indicated. Critical for terrain clearance. 'From High to Low, Look Out Below.'"},{"id":"S05-4","s":5,"topic":"Altimetry Calculations","tag":"MIN SAFE FL · CALCULATION","code":"050 01 06 03","text":"Safety alt 8 300 ft, QNH 983 hPa, ISA dev 0°C. Min safe FL?","options":["FL085","FL095","FL100","FL105"],"correct":1,"explain":"P corr = (1013−983)×30 = 900 ft → 9 200 ft. No T corr (ISA dev=0). Round UP → FL095 (9 500 ft next available FL)."},{"id":"S05-5","s":5,"topic":"Altimetry Calculations","tag":"PRESSURE ALTITUDE","code":"050 01 06 03","text":"Elev 1 000 ft, QNH 983 hPa. Pressure altitude?","options":["1 900 ft","1 000 ft","700 ft","1 300 ft"],"correct":0,"explain":"PA = Elev + (1013 − QNH) × 30 = 1000 + (1013−983)×30 = 1000 + 900 = 1 900 ft. Low QNH → PA > elevation."},{"id":"S05-6","s":5,"topic":"Altimetry Calculations","tag":"QNH FROM QFE","code":"050 01 06 03","text":"Aerodrome elev 600 ft, QFE 997 hPa. QNH?","options":["997 hPa","1 007 hPa","1 014 hPa","1 017 hPa"],"correct":3,"explain":"QNH = QFE + Elev ÷ 30 = 997 + 600÷30 = 997 + 20 = 1 017 hPa. QNH always higher than QFE when aerodrome is above MSL."},{"id":"S05-7","s":5,"topic":"Altimetry Calculations","tag":"TOPOGRAPHIC EFFECT","code":"050 01 06 04","text":"Flying over a mountain ridge in strong winds, the altimeter reads 9 500 ft. True altitude is:","options":["9 500 ft — correct","Below 9 500 ft — Bernoulli effect","Above 9 500 ft — Bernoulli effect","Below — temperature effect"],"correct":1,"explain":"Bernoulli: airflow accelerates over ridge → static pressure drops → altimeter reads HIGH. True alt < Indicated. Terrain is closer than shown — add safety margins."},{"id":"S05-8","s":5,"topic":"Altimetry Calculations","tag":"TEMPERATURE ERROR · CALC","code":"050 01 06 03","text":"Indicated alt 5 000 ft, aerodrome elev 0 ft, OAT −25°C (ISA −40°C). Temperature error ≈","options":["+800 ft","−500 ft","−800 ft","+200 ft"],"correct":2,"explain":"ISA dev = OAT − ISA = −25 − (15−0) = −40°C. Error = 4 × 40 × 5 = 800 ft. Cold → subtract → true alt = 5000 − 800 = 4 200 ft. Altimeter over-reads by 800 ft."},{"id":"S05-9","s":5,"topic":"Altimetry Calculations","tag":"DENSITY ALTITUDE","code":"050 01 06 03","text":"PA = 3 000 ft, OAT = +30°C, ISA T = +9°C. Density altitude ≈","options":["3 000 ft","5 520 ft","1 480 ft","4 200 ft"],"correct":1,"explain":"DA = PA + 120 × (OAT − ISA T) = 3000 + 120 × (30−9) = 3000 + 120×21 = 3000 + 2520 = 5 520 ft. Hot day → DA ≫ PA → degraded performance."},{"id":"S05-10","s":5,"topic":"Altimetry Calculations","tag":"BELOW REFERENCE STATION","code":"050 01 06 03","text":"Aircraft flying BELOW the reference station. Cold T (T < ISA). Effect on indicated altitude vs true altitude?","options":["Indicated < True — correction must be ADDED","Indicated > True — correction must be SUBTRACTED","No effect below station","Same as above station"],"correct":0,"explain":"Below station: effect REVERSES. Cold below station → true alt INCREASES at constant indicated → indicated reads low → add correction. Opposite of the above-station case."},{"id":"S06-1","s":6,"topic":"Wind","tag":"WIND · DEFINITION","code":"050 02 01 00","text":"Wind direction, as reported in a METAR, is the direction FROM which the wind blows, referenced to:","options":["Magnetic North — the same reference used on upper wind forecast charts","True North — the same reference used on runway headings","Grid North — as defined by the chart projection in use","True North — while ATC communicates wind direction to pilots in degrees Magnetic"],"correct":3,"explain":"METAR reports wind direction in degrees True (as measured by the anemometer). ATC passes wind direction to pilots in degrees Magnetic. Upper wind charts also use True North. Runway headings are Magnetic."},{"id":"S06-2","s":6,"topic":"Wind","tag":"WIND · BUYS BALLOT","code":"050 02 01 00","text":"You are standing in the Northern Hemisphere with the wind blowing directly on your back. Where is the lowest pressure?","options":["To your left","To your right","In front of you","Behind you"],"correct":0,"explain":"Buys Ballot's Law (NH): stand with back to wind → LOW on your LEFT, HIGH on your right. In the SH the rule is reversed: LOW to the right."},{"id":"S06-3","s":6,"topic":"Wind","tag":"WIND · CORIOLIS","code":"050 02 02 01","text":"The Coriolis force acting on a moving air mass in the Northern Hemisphere:","options":["Acts in the same direction as the pressure gradient force","Increases with wind speed but is zero at the poles","Deflects air to the RIGHT and is zero at the Equator","Deflects air to the LEFT and is maximum at 45°N"],"correct":2,"explain":"CF = 2ΩρV sinθ. In the NH, Coriolis deflects air to the RIGHT. It is ZERO at the Equator (sinθ = 0) and maximum at the Poles (sinθ = 1). It increases with wind speed V."},{"id":"S06-4","s":6,"topic":"Wind","tag":"WIND · GEOSTROPHIC","code":"050 02 02 01","text":"For the same isobar spacing (same pressure gradient force), increasing latitude will cause the geostrophic wind speed to:","options":["Increase — because Coriolis force increases with latitude","Decrease — because higher Coriolis force requires less speed to balance PGF","Remain unchanged — latitude does not appear in the geostrophic formula","First increase then decrease, with a maximum at 45°"],"correct":1,"explain":"V_geo = PGF / (2Ω ρ sinθ). Same PGF, higher latitude → larger sinθ → larger denominator → lower V. Classic ATPL trap: same isobar spacing at higher latitude = weaker geostrophic wind."},{"id":"S06-5","s":6,"topic":"Wind","tag":"WIND · GRADIENT WIND","code":"050 02 02 01","text":"Around a LOW pressure system, the gradient wind compared to the geostrophic wind for the same isobar spacing is:","options":["Sub-geostrophic — the centrifugal force partially opposes the PGF","Super-geostrophic — the centrifugal force adds to the PGF","Identical — curved isobars do not affect the balance","Variable — depends on latitude but not on curvature"],"correct":0,"explain":"Around a LOW, centrifugal force acts OUTWARD (opposing PGF). Less wind speed is needed for balance → gradient wind is SUB-geostrophic. Around a HIGH, centrifugal adds to PGF → super-geostrophic."},{"id":"S06-6","s":6,"topic":"Wind","tag":"WIND · FRICTION LAYER","code":"050 02 02 02","text":"In the Northern Hemisphere, the surface wind over land compared to the geostrophic wind is approximately:","options":["Veered 30° and increased to 150% of the geostrophic speed","Backed 30° and reduced to 50% of the geostrophic speed","Veered 10° and reduced to 70% of the geostrophic speed","Backed 10° and reduced to 70% of the geostrophic speed"],"correct":1,"explain":"Friction reduces wind speed (≈50% over land, ≈70% over sea) and weakens Coriolis → PGF > CF → wind turns toward low pressure → BACKED by ≈30° over land, ≈10° over sea. Opposite (veers) in SH."},{"id":"S06-7","s":6,"topic":"Wind","tag":"WIND · DIURNAL VARIATION","code":"050 02 02 02","text":"The diurnal variation of surface wind over land reaches its maximum speed at approximately:","options":["30 minutes after sunrise — when the nocturnal inversion first breaks","Midday — when solar radiation is highest","15:00 local time — peak convective mixing brings faster upper winds down","Sunset — when the friction layer is at its deepest"],"correct":2,"explain":"Surface wind peaks around 15:00 LT — maximum solar heating drives convective mixing, transporting faster upper-level momentum down to the surface. Minimum is around 30 min after sunrise."},{"id":"S06-8","s":6,"topic":"Wind","tag":"WIND · CONVERGENCE","code":"050 02 02 03","text":"Upper level DIVERGENCE above a surface LOW pressure system will cause the low to:","options":["Fill — air accumulates above the surface, raising surface pressure","Move equatorward due to upper-level steering winds","Generate fog due to subsidence of dry air","Deepen — air is removed aloft faster than it converges at the surface"],"correct":3,"explain":"If upper divergence > surface convergence, more air is removed than added → column mass decreases → surface pressure falls → LOW DEEPENS. Upper convergence over a LOW causes filling."},{"id":"S06-9","s":6,"topic":"Wind","tag":"WIND · MEASUREMENT","code":"050 02 01 00","text":"The wind reported in a routine METAR is an average measured over:","options":["1 minute — instantaneous reading at the time of observation","5 minutes — standard WMO interval for aerodromes","10 minutes — standard averaging period for METAR reports","30 minutes — to smooth out gusts for trend forecasting"],"correct":2,"explain":"METAR wind = 10-minute average at 10 m AGL. ATC gives pilots a 2-minute average for take-off and landing. Gusts are reported when max during the past 10 min exceeds mean by ≥10 kt."},{"id":"S06-10","s":6,"topic":"Wind","tag":"WIND · VEERING & BACKING","code":"050 02 01 01","text":"A wind change from 220° to 270° is described as:","options":["Backing — an anticlockwise change in wind direction","Veering — a clockwise change in wind direction","A squall — a sustained increase in wind speed over a wide area","A gust — a short-duration increase in wind speed"],"correct":1,"explain":"220° → 270° is a clockwise change = VEERING (both hemispheres). Backing is anticlockwise. Veering with height in NH = warm air advection. Backing with height = cold air advection."},{"id":"S07-1","s":7,"topic":"Wind (II)","tag":"WIND · GLOBAL CIRCULATION","code":"050 02 03 01","text":"Which cell covers latitudes 30–60° and is classified as an indirect thermal cell?","options":["Polar cell","Hadley cell","Walker cell","Ferrel cell"],"correct":3,"explain":"The Ferrel cell (30–60°) is thermally indirect — driven by the adjacent Hadley and Polar cells, not by its own temperature contrast."},{"id":"S07-2","s":7,"topic":"Wind (II)","tag":"WIND · ITCZ","code":"050 02 03 01","text":"At the ITCZ, the dominant weather is characterised by:","options":["Rising air, deep convection, heavy rain and Cb","Sinking air, clear skies and divergence","Strong surface winds and frontal activity","Stable stratiform cloud and drizzle"],"correct":0,"explain":"ITCZ = convergence zone. Moist trade winds converge and rise → deep convection, Cb, heavy rain. A significant operational hazard for equatorial routes."},{"id":"S07-3","s":7,"topic":"Wind (II)","tag":"WIND · MONSOON","code":"050 02 03 01","text":"The SW monsoon over the Indian subcontinent in July is caused by:","options":["Polar cell expansion in NH summer","Coriolis force reversal at solstice","Intense continental low over Asia drawing in moist oceanic air","Subtropical jet shifting poleward"],"correct":2,"explain":"NH summer: intense heating over Asia creates a thermal low → moist ocean air flows onshore from the SW → SW monsoon. Classic large-scale sea breeze effect."},{"id":"S07-4","s":7,"topic":"Wind (II)","tag":"WIND · LOCAL WINDS","code":"050 02 04 01","text":"An anabatic wind flows up a sunlit slope. Compared to katabatic, its typical speed is:","options":["Similar — both average 10 kt","Weaker — anabatic ~5 kt vs katabatic ~10 kt","Stronger — solar heating drives faster flow","Equal at same latitude and slope angle"],"correct":1,"explain":"Anabatic ~5 kt (light thermal rise). Katabatic ~10 kt — cold dense air drains more powerfully under gravity. Snow cover and clear sky can intensify katabatic further."},{"id":"S07-5","s":7,"topic":"Wind (II)","tag":"WIND · KATABATIC","code":"050 02 04 01","text":"A valley airfield is susceptible to frost and radiation fog on clear, calm nights. The most likely cause is:","options":["Cold air pooling from katabatic drainage into the valley","Anabatic flow trapping moisture near the surface","Sea breeze advecting cold marine air inland","Upper-level divergence suppressing cloud formation"],"correct":0,"explain":"Katabatic flow drains cold dense air into valleys at night → cold air pool → temperature drops to dew point → frost and radiation fog. Classic valley airfield hazard."},{"id":"S07-6","s":7,"topic":"Wind (II)","tag":"WIND · VENTURI","code":"050 02 04 01","text":"The Venturi effect through a mountain pass causes which altimetry error?","options":["Altimeter reads LOW — true altitude is higher","Altimeter reads HIGH — true altitude is lower","No error — Venturi only affects dynamic pressure","Altimeter over-reads then under-reads as terrain changes"],"correct":1,"explain":"Venturi lowers static pressure → altimeter senses higher altitude → reads HIGH → true altitude is LOWER than indicated. Terrain clearance risk."},{"id":"S07-7","s":7,"topic":"Wind (II)","tag":"WIND · SEA BREEZE","code":"050 02 04 01","text":"Which combination of conditions BEST favours sea breeze development?","options":["Overcast sky, strong synoptic onshore wind, cold sea","Cloudy, moderate synoptic offshore wind, warm sea","Clear sky, weak synoptic PGF, warm land–cool sea contrast","Fog over land, strong pressure gradient, calm sea"],"correct":2,"explain":"Sea breeze requires clear sky, weak synoptic PGF, and a good land–sea temperature contrast. Strong synoptic winds suppress it."},{"id":"S07-8","s":7,"topic":"Wind (II)","tag":"WIND · LAND BREEZE","code":"050 02 04 01","text":"Compared to the sea breeze, the land breeze is typically:","options":["Stronger and extends further offshore","Same speed but reversed direction","Warmer and more turbulent","Weaker (~5 kt) and shallower (~500–1000 ft)"],"correct":3,"explain":"Land–sea temperature contrast is smaller at night → weaker land breeze: ~5 kt vs ~10 kt, ~5 NM vs ~15 NM, 500–1000 ft vs ~1000 ft. Same mechanism, reversed direction, reduced intensity."},{"id":"S07-9","s":7,"topic":"Wind (II)","tag":"WIND · NLLJ","code":"050 02 04 01","text":"What operational hazard does the nocturnal low-level jet (NLLJ) present to arriving aircraft?","options":["Icing in the inversion layer","Unexpected tailwind component on final","Wind shear at the inversion top and possible airframe limit exceedance","Reduced visibility due to nocturnal fog"],"correct":2,"explain":"NLLJ up to 60 kt sits at the inversion top. Aircraft descending through it encounter sudden wind shear → airspeed excursion, potential loss of control on approach."},{"id":"S07-10","s":7,"topic":"Wind (II)","tag":"WIND · COASTAL AIRFIELD","code":"050 02 04 01","text":"A pilot reports that the METAR wind at a coastal airfield has veered significantly since the morning briefing. The most likely explanation in summer is:","options":["Katabatic drainage replacing the synoptic wind","The sea breeze establishing and veering under Coriolis influence","Approaching warm front rotating the isobars","ITCZ migration shifting the trade wind direction"],"correct":1,"explain":"Sea breeze starts perpendicular to coast and veers clockwise during the afternoon (NH Coriolis). A coastal airfield in summer sees progressive clockwise veer as the sea breeze matures."},{"id":"S08-1","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · MOUNTAIN WAVES","code":"050 02 05 00","text":"Which condition is NOT required for the formation of mountain waves?","options":["Wind speed ≥15 kt at mountain level","Wind direction within 30° of perpendicular to the ridge","Stable layer at or just above the ridge","Wind speed must increase with altitude above the ridge"],"correct":3,"explain":"Mountain waves require: wind ≥15 kt perpendicular to the ridge and a stable layer at ridge level. Wind speed increasing above the ridge is NOT a strict requirement."},{"id":"S08-2","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · ACSL","code":"050 02 05 01","text":"A lenticular cloud (ACSL — Altocumulus Standing Lenticular) appears stationary because:","options":["Air continuously flows through it, marking a fixed wave crest","The cloud is frozen at high altitude","The wave has dissipated and only the cloud remains","The cloud forms in the rotor zone below the crest"],"correct":0,"explain":"A lenticular cloud marks a fixed wave crest — air flows through continuously, condensing upwind and evaporating downwind. The cloud itself does not move with the wind."},{"id":"S08-3","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · ROTOR ZONE","code":"050 02 05 01","text":"The MOST dangerous zone for light aircraft in mountain wave conditions is:","options":["Directly above the mountain peak","Between the cap cloud and the lenticular cloud","The rotor zone, below the first wave crest in the lee","The tropopause, where wave amplitude is highest"],"correct":2,"explain":"The rotor zone contains severe, chaotic turbulence with reversed surface flow. It is the most hazardous zone, especially for light aircraft."},{"id":"S08-4","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · MECHANICAL","code":"050 02 06 01","text":"Mechanical turbulence intensity depends primarily on:","options":["Air temperature and humidity","Wind speed and surface roughness","Lapse rate and cloud base height","Pressure gradient and Coriolis force"],"correct":1,"explain":"Mechanical turbulence is caused by friction and disruption around surface obstacles. Its intensity depends on wind speed and surface roughness — stronger wind and rougher terrain both increase turbulence."},{"id":"S08-5","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · THERMAL","code":"050 02 06 01","text":"Thermal turbulence is most severe when:","options":["Surface heating is strong and the atmosphere is unstable","A temperature inversion is present at low level","Wind speed is low and relative humidity is high","Cloud cover is complete, preventing solar radiation"],"correct":0,"explain":"Strong solar heating combined with atmospheric instability generates vigorous convective currents, producing severe thermal turbulence."},{"id":"S08-6","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · FRONTAL","code":"050 02 06 01","text":"Frontal turbulence is typically associated with:","options":["Mountain ridges perpendicular to the wind","Wind shear along the frontal surface and embedded Cb","Clear air at cruise level above FL 350","Anticyclonic flow at the tropopause"],"correct":1,"explain":"Frontal turbulence results from wind shear along the frontal boundary and embedded cumulonimbus. Cold fronts produce the most severe cases."},{"id":"S08-7","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · CAT DEFINITION","code":"050 02 06 03","text":"CAT (Clear Air Turbulence) is defined as turbulence:","options":["Inside cumulonimbus clouds above FL 250","In the boundary layer, caused by surface heating","Above 15 000 ft in cloud-free air, associated with wind shear","Below the tropopause, in frontal cloud"],"correct":2,"explain":"CAT occurs above 15 000 ft in clear air with no visual warning. It is caused by wind shear near the jet stream and cannot be detected by weather radar."},{"id":"S08-8","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · CAT LOCATION","code":"050 02 06 03","text":"The PRIMARY CAT zone relative to the polar jet stream is located on the:","options":["Warm-air side, above the jet core","Warm-air side, below the jet core","Cold-air side, above the jet core","Cold-air side, just below the jet core"],"correct":3,"explain":"The primary CAT zone is on the cold-air (poleward) side, just below the jet core, where vertical wind shear is greatest."},{"id":"S08-9","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · PROCEDURES","code":"050 02 06 00","text":"When encountering unexpected severe turbulence in cruise, the immediate priority is to:","options":["Increase speed to maintain control authority","Descend below the turbulence layer immediately","Reduce to turbulence penetration speed (VB) and inform ATC","Switch off autopilot and hand-fly at maximum cruise speed"],"correct":2,"explain":"Reduce to VB immediately to avoid structural damage. Turn on seat-belt signs and notify ATC. Increasing speed risks overstressing the airframe."},{"id":"S08-10","s":8,"topic":"Turbulence & CAT","tag":"TURBULENCE · VISUAL INDICATORS","code":"050 02 05 01","text":"Which is the best visual indicator of severe mountain wave activity?","options":["Cumulonimbus with anvil shape","Rotor cloud below the wave crest combined with lenticular clouds above","Stratus layers covering the mountain top","Cirrus uncinus (mare’s tails) at high altitude"],"correct":1,"explain":"The combination of a rotor cloud (low, turbulent, rolling) and lenticular clouds (stationary, lens-shaped) is the classic visual signature of active mountain wave activity."},{"id":"S09-1","s":9,"topic":"Jet Streams","tag":"JET STREAM · DEFINITION","code":"050 02 07 00","text":"A jet stream is best defined as a narrow band of strong winds, typically found:","options":["In the stratosphere, with core wind speeds always above 30 kt","Throughout the whole troposphere, never exceeding 40 kt","At the surface, associated with frontal boundaries","Near the tropopause, with core wind speed of 60 kt or more"],"correct":3,"explain":"A jet stream is a narrow, quasi-horizontal current of air concentrated near the tropopause, with a core wind speed of at least 60 kt (ICAO definition), typically 2000 NM long, 200 NM wide and 2 NM deep."},{"id":"S09-2","s":9,"topic":"Jet Streams","tag":"JET STREAM · FORMATION","code":"050 02 07 02","text":"The primary cause of a jet stream is:","options":["A large horizontal temperature gradient, producing a strong thermal wind","Surface friction convergence beneath a ridge","The Coriolis force acting alone, independent of any temperature gradient","Conservation of angular momentum only, unrelated to temperature gradients"],"correct":0,"explain":"A sharp horizontal temperature gradient creates a strong thermal wind component with height; added to the surface geostrophic wind, this produces the very strong westerly flow found at the jet core. Conservation of angular momentum poleward is a secondary contributor."},{"id":"S09-3","s":9,"topic":"Jet Streams","tag":"JET STREAM · POLAR FRONT","code":"050 02 07 02","text":"The Polar Front Jet lies:","options":["Only over oceans, never over continental landmasses","Directly above the Intertropical Convergence Zone","Parallel to the surface position of the warm and cold fronts of polar front depressions","At a fixed latitude year-round, unaffected by season"],"correct":2,"explain":"The Polar Front Jet runs parallel to the surface fronts of polar front depressions, typically 40°–65°N in the NH and 50°–55°S in the SH, shifting equatorward and strengthening in winter."},{"id":"S09-4","s":9,"topic":"Jet Streams","tag":"JET STREAM · SUBTROPICAL","code":"050 02 07 02","text":"The Subtropical Jet is associated with:","options":["The polar front, between polar and tropical air","The descending branch of the Hadley cell, with its core around the 200 hPa level","The boundary between Arctic and polar air","Surface anticyclogenesis only, with no upper-level signature"],"correct":1,"explain":"The Subtropical Jet sits over the subtropical anticyclones, above the descending (dry, sinking) branch of the Hadley cell, with a core near 200 hPa; it moves seasonally with the subtropical high-pressure belt."},{"id":"S09-5","s":9,"topic":"Jet Streams","tag":"JET STREAM · ARCTIC","code":"050 02 07 02","text":"The Arctic (front) jet stream forms along the boundary between:","options":["Arctic air and polar air","Tropical air and polar air","Polar air and subtropical air","Two polar air masses of identical temperature"],"correct":0,"explain":"The Arctic jet lies between the boundary of Arctic air and Polar air, typically around 60°N in winter (45°–50°N over the USA), core near 20 000 ft (400 hPa); it is a transient feature linked to Arctic air outbreaks."},{"id":"S09-6","s":9,"topic":"Jet Streams","tag":"JET STREAM · SEASONAL MOVEMENT","code":"050 02 07 02","text":"Compared with summer, in winter the polar front jet is generally:","options":["Weaker and displaced further poleward","Stronger and displaced further equatorward, at a lower level","Stronger and displaced further poleward, at a higher level","Unchanged in strength, latitude and level"],"correct":1,"explain":"In winter the temperature contrast between polar and tropical air is greatest, so the polar front jet strengthens and shifts equatorward, descending to a slightly lower level than in summer."},{"id":"S09-7","s":9,"topic":"Jet Streams","tag":"JET STREAM · CAT","code":"050 02 07 03","text":"The primary Clear Air Turbulence (CAT) zone associated with a jet stream is located:","options":["Above the jet axis, on the warm side","At the jet core itself, regardless of which side","Near to, or just below, the jet axis, on the cold (low-pressure) side","Only on the warm side, well above the tropopause"],"correct":2,"explain":"The strongest CAT is found near/just below the jet axis on its cold, low-pressure side, where horizontal and vertical wind shear are greatest. A weaker, secondary CAT zone exists above the jet axis."},{"id":"S09-8","s":9,"topic":"Jet Streams","tag":"JET STREAM · RECOGNITION","code":"050 02 07 02","text":"On satellite imagery, the presence of a jet stream is often revealed by:","options":["A ring of stratocumulus cloud encircling the core","Fog banks that track the jet core at the surface","A persistent cloud-free corridor with no diagnostic signature","Banded cirrus cloud running roughly perpendicular to the jet axis"],"correct":3,"explain":"Cirrus cloud bands aligned roughly perpendicular to the flow, and an arc of cirrus on the poleward side of a jet streak, are classic satellite signatures of a jet stream."},{"id":"S09-9","s":9,"topic":"Jet Streams","tag":"JET STREAM · CHARTS","code":"050 02 07 02","text":"On upper-air or SIGWX charts, a jet stream is typically indicated by:","options":["Widely spaced isobars only, with no wind data","A single dashed line with no numerical values attached","Tightly packed isotachs/isohypses with a labelled jet symbol showing FL, direction and speed","Surface pressure tendency arrows only"],"correct":2,"explain":"Jet streams appear on upper-air charts as tightly packed contour/isotach lines, and on SIGWX charts as a labelled jet symbol giving the flight level, direction and maximum wind speed of the core."},{"id":"S09-10","s":9,"topic":"Jet Streams","tag":"JET STREAM · TROPICAL EASTERLY","code":"050 02 07 02","text":"The Tropical Easterly Jet occurs:","options":["Year-round, across the mid-latitudes of both hemispheres","Only in the Northern Hemisphere summer, around 10°–20°N, driven by the Asian monsoon heat source","Only during the Southern Hemisphere winter, over Australia","At the same altitude and strength as the Polar Front Jet"],"correct":1,"explain":"The Tropical Easterly Jet is a strong easterly flow confined to the NH summer monsoon season, around 10°–20°N, near the 100 hPa level, driven by the heat contrast between the Asian plateau and cooler air to the south."},{"id":"S10-1","s":10,"topic":"Thermodynamics","tag":"HUMIDITY · WATER VAPOUR","code":"050 03 01 01","text":"Which statement about water vapour in the atmosphere is correct?","options":["Water vapour is heavier than dry air at the same temperature and pressure","The amount of water vapour air can hold decreases as temperature increases","Water vapour content is measured directly as relative humidity, independent of temperature","Water vapour is lighter than dry air, so humid air is less dense than dry air at the same temperature and pressure"],"correct":3,"explain":"Water vapour (molar mass ≈18) is lighter than the N2/O2 mix of dry air (≈29), so moist air is LESS dense than dry air at equal T and P — this is why high humidity reduces aircraft performance."},{"id":"S10-2","s":10,"topic":"Thermodynamics","tag":"HUMIDITY · DEW POINT","code":"050 03 01 02","text":"The dew point temperature is defined as the temperature to which air must be cooled, at constant pressure and moisture content, for:","options":["Saturation to occur (relative humidity reaches 100%)","The relative humidity to fall to 50%","Condensation nuclei to be destroyed","The air to reach its adiabatic lapse-rate boundary"],"correct":0,"explain":"Dew point is the temperature at which air becomes saturated (RH = 100%) at constant pressure and moisture content. The closer the actual temperature is to the dew point, the higher the relative humidity."},{"id":"S10-3","s":10,"topic":"Thermodynamics","tag":"CHANGE OF STATE · LATENT HEAT","code":"050 03 02 01","text":"When water vapour condenses into liquid water droplets, the process:","options":["Absorbs latent heat from the surrounding air, cooling it","Has no thermal effect on the surrounding air","Releases latent heat into the surrounding air, warming it","Only occurs at temperatures below 0°C"],"correct":2,"explain":"Condensation RELEASES latent heat into the surrounding air, warming it. This release of energy is a key driver of cumulus growth and thunderstorm development."},{"id":"S10-4","s":10,"topic":"Thermodynamics","tag":"ADIABATIC PROCESSES · LAPSE RATES","code":"050 03 03 01","text":"The Saturated Adiabatic Lapse Rate (SALR) is lower than the Dry Adiabatic Lapse Rate (DALR) because:","options":["Saturated air is denser and cools faster with height","Latent heat released by condensation partially offsets the cooling of the rising, saturated parcel","The SALR only applies above the tropopause","The DALR accounts for relative humidity while the SALR does not"],"correct":1,"explain":"As a saturated parcel rises and cools, condensation releases latent heat that offsets part of the adiabatic cooling. Hence SALR (variable, roughly 1.5–2°C/1000ft) is always less than the constant DALR (3°C/1000ft)."},{"id":"S10-5","s":10,"topic":"Thermodynamics","tag":"STABILITY · ABSOLUTE STABILITY","code":"050 03 03 01","text":"If the Environmental Lapse Rate (ELR) is less than the Saturated Adiabatic Lapse Rate (SALR), the atmosphere is:","options":["Absolutely stable","Absolutely unstable","Conditionally unstable","Neutral for saturated air only"],"correct":0,"explain":"ELR < SALR < DALR = absolutely stable. A displaced parcel, whether dry or saturated, is always cooler and denser than its environment, so it sinks back — no vertical development can occur."},{"id":"S10-6","s":10,"topic":"Thermodynamics","tag":"STABILITY · ABSOLUTE INSTABILITY","code":"050 03 03 01","text":"An atmosphere is described as absolutely unstable when:","options":["The ELR lies between the SALR and the DALR","The ELR is greater than the DALR","The ELR equals the DALR exactly","The ELR is less than the SALR"],"correct":1,"explain":"ELR > DALR = absolutely unstable. A rising parcel is always warmer (and less dense) than the surrounding air, whether saturated or not, so it keeps accelerating upward."},{"id":"S10-7","s":10,"topic":"Thermodynamics","tag":"STABILITY · CONDITIONAL INSTABILITY","code":"050 03 03 01","text":"Conditional instability exists when the ELR lies between the SALR and the DALR. In this situation, a rising parcel of air is:","options":["Always unstable, regardless of saturation","Always stable, regardless of saturation","Stable while unsaturated, but potentially unstable once it becomes saturated","Unstable only above the freezing level"],"correct":2,"explain":"SALR < ELR < DALR: the parcel is stable while rising dry (it cools faster than the environment at the DALR) but, once lifted to saturation, it cools more slowly (SALR) and may become warmer than its surroundings — instability is 'conditional' on saturation being reached."},{"id":"S10-8","s":10,"topic":"Thermodynamics","tag":"STABILITY · NEUTRAL EQUILIBRIUM","code":"050 03 03 01","text":"An atmosphere is in neutral equilibrium for unsaturated air when the ELR is:","options":["Equal to the SALR","Greater than the DALR","Less than the SALR","Equal to the DALR"],"correct":3,"explain":"Neutral stability for dry/unsaturated air occurs when ELR = DALR: a displaced dry parcel cools at exactly the same rate as its environment, so it has no tendency to return or to keep moving — indifferent equilibrium."},{"id":"S10-9","s":10,"topic":"Thermodynamics","tag":"FÖHN EFFECT · WARMING MECHANISM","code":"050 03 03 01","text":"During the Föhn effect, the air descending on the leeward side of a mountain range arrives warmer and drier than it was at the same altitude on the windward side, mainly because:","options":["The descending air is compressed adiabatically at the SALR","Friction with the terrain generates additional sensible heat","Moisture lost as precipitation during ascent means the parcel descends dry at the DALR over the same height range it originally rose partly saturated at the slower SALR","The leeward slope faces the sun for longer each day"],"correct":2,"explain":"On the windward side the parcel cools at the DALR, then more slowly at the SALR above cloud base, losing moisture as precipitation. Descending on the leeward side it is now dry and warms at the steeper DALR throughout — leaving it warmer and drier than at the start."},{"id":"S10-10","s":10,"topic":"Thermodynamics","tag":"FÖHN EFFECT · SURFACE SIGNATURE","code":"050 03 03 01","text":"A classic surface indication of a Föhn wind on the leeward side of a mountain range is:","options":["Persistent low stratus and drizzle","A warm, dry, gusty wind, often with a band of cloud sitting over the mountain crest (the 'Föhn wall')","Fog formation at valley level","A marked increase in relative humidity at the surface"],"correct":1,"explain":"Leeward Föhn winds are characteristically warm, dry and gusty. The cloud produced during the windward ascent often banks up against the ridge — the 'Föhn wall' — while the lee slopes and valley remain clear."},{"id":"S11-1","s":11,"topic":"Clouds, Fog & Precipitation","tag":"CLOUDS · CEILING","code":"050 04 01 00","text":"Ceiling, as used in a METAR, is defined as the height AAL of:","options":["The base of the lowest cloud layer of any amount","The base of the highest cloud layer reported as overcast","The tropopause, where cloud growth is capped by the inversion","The base of the lowest layer of cloud amount BKN or OVC (more than 4 oktas)"],"correct":3,"explain":"Ceiling = height AAL of the lowest layer covering more than 4 oktas (BKN or OVC) — also called the main cloud base. A thin FEW/SCT layer below it does not count as ceiling."},{"id":"S11-2","s":11,"topic":"Clouds, Fog & Precipitation","tag":"CLOUD FORMATION · LIFTING","code":"050 04 01 01","text":"Which lifting mechanism is responsible for stratocumulus forming under an inversion, restricted to the friction layer?","options":["Turbulence","Convection","Frontal (widespread) ascent","Convergence"],"correct":0,"explain":"Surface friction mixes air up to the top of the friction layer. Vertical development is capped there by an inversion, so the cloud spreads horizontally into St/Sc rather than growing upward."},{"id":"S11-3","s":11,"topic":"Clouds, Fog & Precipitation","tag":"OROGRAPHIC CLOUD · FÖHN EFFECT","code":"050 04 01 01","text":"On the lee side of a mountain range, after precipitation has fallen from stable air on the windward slopes, the Föhn effect typically produces:","options":["A lower cloud base and cooler, moister surface air","The same cloud base and temperature as the windward side","A higher cloud base, and warmer, drier surface air","Persistent fog trapped against the lee slopes"],"correct":2,"explain":"Air that has lost moisture as precipitation on the windward side descends on the lee side and warms at the DALR (faster than it cooled on the way up) — result: higher cloud base, warmer and drier surface air."},{"id":"S11-4","s":11,"topic":"Clouds, Fog & Precipitation","tag":"CONVECTION · CLOUD BASE FORMULA","code":"050 04 01 01","text":"Using H (m) = 125 × (T − Td), a surface temperature of 26°C and dew point of 10°C gives a convective cloud base closest to:","options":["1250 m","2000 m","3250 m","4500 m"],"correct":1,"explain":"H = 125 × (26 − 10) = 125 × 16 = 2000 m. This formula applies best on a sunny afternoon with air well mixed from the surface up to cloud base."},{"id":"S11-5","s":11,"topic":"Clouds, Fog & Precipitation","tag":"CLASSIFICATION · BASIC FORMS","code":"050 04 01 02","text":"A cloud with considerable horizontal extent but little vertical development, formed by gentle widespread lift in stable air, is classified as:","options":["Stratiform","Cumuliform","Cirriform","Convective"],"correct":0,"explain":"Stratiform clouds are layered with little vertical extent, produced by gentle, widespread lift in stable air — as opposed to cumuliform (heaped, unstable) or cirriform (fibrous, high-level ice)."},{"id":"S11-6","s":11,"topic":"Clouds, Fog & Precipitation","tag":"INVERSIONS · CLOUD GROWTH","code":"050 04 01 03","text":"An inversion layer above a developing cumulus cloud will typically:","options":["Accelerate its vertical growth into a cumulonimbus","Cap its vertical development, flattening the cloud top","Have no effect on its vertical development","Cause the cloud to descend and dissipate immediately"],"correct":1,"explain":"An inversion is an extremely stable layer that inhibits further vertical development — the same capping effect occurs at the tropopause, flattening a Cb top into its characteristic anvil."},{"id":"S11-7","s":11,"topic":"Clouds, Fog & Precipitation","tag":"FOG · RADIATION FOG","code":"050 04 02 02","text":"The ideal conditions for radiation fog to form and thicken overnight are:","options":["Overcast sky, strong wind, low humidity","Clear sky, calm (0 kt) wind, moderate humidity","Clear sky, light wind (2–8 kt), high relative humidity","Broken cloud, wind above 20 kt, high humidity"],"correct":2,"explain":"Clear sky maximises terrestrial radiation (cooling); light wind (2–8 kt) mixes and thickens the fog without dispersing it; high RH means little cooling is needed to reach saturation."},{"id":"S11-8","s":11,"topic":"Clouds, Fog & Precipitation","tag":"FOG · SEA SMOKE","code":"050 04 02 04","text":"Sea smoke forms when:","options":["Warm moist air moves over a much colder sea surface","Cold air moves over a much colder land surface","Warm air moves over a much warmer sea surface","Cold air moves over a much warmer sea surface"],"correct":3,"explain":"Sea smoke is the polar counterpart of advection fog: very stable cold air moves over a much warmer sea, and only a small amount of evaporation is needed to saturate it."},{"id":"S11-9","s":11,"topic":"Clouds, Fog & Precipitation","tag":"PRECIPITATION · THEORIES","code":"050 05 01 01","text":"The coalescence theory of precipitation development, unlike the Bergeron-Findeisen theory, requires:","options":["Ice crystals and supercooled water droplets coexisting below 0°C","A strong inversion above the cloud top","A cloud entirely above 0°C, with a range of droplet sizes colliding","Freezing nuclei to be more abundant than condensation nuclei"],"correct":2,"explain":"Coalescence occurs in warm clouds (T > 0°C): large droplets collide with smaller ones and grow until heavy enough to fall as drizzle or rain — no ice phase is involved, unlike Bergeron-Findeisen."},{"id":"S11-10","s":11,"topic":"Clouds, Fog & Precipitation","tag":"PRECIPITATION · FREEZING RAIN","code":"050 05 02 01","text":"Freezing rain forms when raindrops, already liquid after falling through a warm layer aloft, pass through:","options":["A deep sub-zero layer near the surface, freezing well above ground","A shallow sub-zero layer near the surface, freezing on contact with the ground or aircraft","A layer of ice crystals near the surface, growing further by sublimation","A convective downdraught inside a cumulonimbus"],"correct":1,"explain":"The sub-zero surface layer is too thin for the liquid drops to freeze in the air, so they remain supercooled and freeze instantly on contact with any surface — a severe airframe icing hazard."},{"id":"S12-1","s":12,"topic":"Air Masses and Fronts","tag":"AIR MASSES · SOURCE REGIONS","code":"050 06 01 01","text":"A source region favourable for the formation of a well-defined air mass must be:","options":["Mountainous, with strong horizontal temperature gradients","Coastal, with frequent frontal passages","Located under the polar jet stream core","Extensive and uniform in surface temperature and moisture, with light winds"],"correct":3,"explain":"A good source region is a large, uniform surface (ocean or land) with light, slow-moving air, allowing the air to sit long enough to take on the temperature and moisture of the surface below — e.g. the Siberian plains (cP) or the subtropical oceans (mT)."},{"id":"S12-2","s":12,"topic":"Air Masses and Fronts","tag":"AIR MASSES · CLASSIFICATION","code":"050 06 01 01","text":"An air mass labelled \"mTw\" is:","options":["Maritime Tropical, warmer than the surface it is now over","Maritime Tropical, colder than the surface it is now over","Modified Tropical, warmer than its source region","Mountain Tropical, with orographic modification"],"correct":0,"explain":"The lowercase suffix describes the CURRENT relationship to the surface, not the source: \"w\" (warm) means the air mass is warmer than the surface beneath it — typically stable, and prone to advection fog and poor visibility over the sea."},{"id":"S12-3","s":12,"topic":"Air Masses and Fronts","tag":"AIR MASSES · MODIFICATION","code":"050 06 01 02","text":"Polar continental (cP) air that tracks out over a relatively warm sea for a long fetch is typically modified into:","options":["A stable, fog-prone air mass with widespread stratus","A completely dry air mass with no cloud development","An unstable air mass with cumulus/cumulonimbus and showers","Tropical maritime air, once fully modified"],"correct":2,"explain":"Cold cP air moving over a much warmer sea is heated and moistened from below, becoming unstable — this is exactly how cold, dry continental air (e.g. off Scandinavia) turns into a shower-bearing mPc airstream reaching the UK."},{"id":"S12-4","s":12,"topic":"Air Masses and Fronts","tag":"FRONTS · GENERAL ASPECTS","code":"050 06 02 01","text":"A front is best defined as:","options":["Any line of low pressure on a synoptic chart","The boundary (transition zone) between two air masses of different density","The centre of a depression, where isobars are most closely packed","A line of showers embedded within a single air mass"],"correct":1,"explain":"A front is a sloping transition zone — not a sharp line — separating two air masses of different temperature/density. Its slope and the weather it produces depend on which air mass is advancing and how steeply it is inclined."},{"id":"S12-5","s":12,"topic":"Air Masses and Fronts","tag":"WARM FRONT · SLOPE & SPEED","code":"050 06 02 02","text":"Compared with a typical cold front, a warm front has:","options":["A much shallower slope (~1:150) and moves slower, at about 2/3 of the geostrophic wind component","A much steeper slope and moves faster along the surface","The same slope, but produces heavier, more showery precipitation","No defined slope, since warm air cannot overlay cold air"],"correct":0,"explain":"A warm front slopes very gently (around 1:150) because the light warm air rides up over the retreating cold air ahead of it; this shallow slope, plus its slower speed (≈2/3 of the geostrophic interval), produces the long, widespread Ci→Cs→As→Ns sequence."},{"id":"S12-6","s":12,"topic":"Air Masses and Fronts","tag":"COLD FRONT · WEATHER","code":"050 06 02 03","text":"The typical weather at the passage of a cold front includes:","options":["A gradual, prolonged spell of light continuous rain from thickening stratus","A sharp wind veer, sudden temperature fall, and heavy/showery precipitation from Cu/Cb","No significant change in wind, temperature or cloud","A slow pressure fall that continues well behind the front"],"correct":1,"explain":"Because the cold front is steep and fast-moving, its passage is abrupt: sharp veer, sudden fall in temperature and dew point, heavy or showery rain (sometimes with hail/thunder) from Cu/Cb, and pressure starts to rise soon after passage."},{"id":"S12-7","s":12,"topic":"Air Masses and Fronts","tag":"WARM SECTOR · WEATHER","code":"050 06 02 04","text":"Inside the warm sector, between the warm front and the following cold front, the weather is typically:","options":["Violent, with frequent embedded thunderstorms and hail","Dominated by high-based cirrus with no precipitation at all","Relatively quiet — steady wind and temperature, drizzle or light rain from low stratus, and often poor visibility","Identical to the weather well ahead of the warm front"],"correct":2,"explain":"The warm sector contains a single, uniform (warm) air mass, so once the warm front has passed, conditions settle: steady SW-ish wind, steady temperature, low stratus/drizzle, and visibility that can be poor — especially over the sea or in winter (advection fog)."},{"id":"S12-8","s":12,"topic":"Air Masses and Fronts","tag":"OCCLUSIONS · WARM VS COLD","code":"050 06 02 06","text":"A warm occlusion forms, rather than a cold occlusion, when:","options":["There is no temperature difference between the two cold air masses","The air ahead of the (original) warm front is warmer than the air behind the cold front","The depression has already reached its dissipating stage","The air ahead of the (original) warm front is colder than the air behind the cold front"],"correct":3,"explain":"In a warm occlusion, the air ahead of the old warm front is colder (denser) than the air behind the cold front, so the cold front rides up over it instead of undercutting it — the warm sector air is lifted, but the cold front's own air stays nearer the surface."},{"id":"S12-9","s":12,"topic":"Air Masses and Fronts","tag":"STATIONARY FRONT","code":"050 06 02 07","text":"A front is classified as stationary when:","options":["It moves away from the depression centre faster than the depression itself","It is located exactly at the triple point of the depression","Neither air mass is displacing the other, so the front shows little or no movement along the surface","It has fully occluded and the warm sector no longer reaches the ground"],"correct":2,"explain":"A stationary front occurs when the pressure pattern gives little or no component of wind blowing one air mass into the other, so the front barely moves — weather is similar to a warm front but can persist for a long time over the same area."},{"id":"S12-10","s":12,"topic":"Air Masses and Fronts","tag":"LIFE CYCLE · FRONTAL WAVE","code":"050 06 02 08 / 050 06 02 09","text":"As a frontal-wave depression matures and the cold front catches up with the warm front, what happens to the sequence of surface pressure and wind?","options":["Pressure only changes at the point of occlusion, remaining constant everywhere else","Pressure falls ahead of the system, the fall stops at the warm front, and pressure then rises once the cold front — with its own sharp veer — has passed","Wind direction remains from the south for the whole life cycle, regardless of frontal passage","Pressure keeps falling steadily throughout, with no change in wind direction at any front"],"correct":1,"explain":"Through the life cycle, pressure falls ahead of the system, the fall stops (or slows) at the warm front, stays roughly steady in the warm sector, and then rises again once the cold front — with its own sharp veer — has passed; this progressive change in wind and pressure is the classic sequence exploited to forecast frontal passage."},{"id":"S13-1","s":13,"topic":"Pressure Systems","tag":"ANTICYCLONE · DEFINITION","code":"050 07 02 00","text":"Compared with a depression, the isobars around an anticyclone are typically:","options":["More closely spaced, giving stronger winds","More widely spaced, giving lighter winds","Identical in spacing to a depression","Only found in the Southern Hemisphere"],"corr
