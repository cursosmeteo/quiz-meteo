<script>/*!
 * KSA DUEL — ksa-duel.js  (simple version, first classroom test)
 * ATPL 050 Meteorology · Session 21
 *  - pre-test speed scoring (end-of-session quiz rules) and crew formation (best + last)
 *  - 3 challenges per crew: 2 from the question bank (editable) + 1 chart challenge (chart + related code)
 *  - duel order, game points (right +1 · author +1 per miss), K / S / A
 * Carlos Paizinho · cursos.meteo@gmail.com · Developed with Claude (Anthropic)
 */
(function (root) {
'use strict';

function quizPoints(correct, answered, secs) {
  if (!answered) return -2;
  if (!correct) return -4;
  return Math.max(1, 6 - Math.floor(Math.max(0, secs) / 5));
}
function gradePretest(questions, answers, starts) {
  let pts = 0, correct = 0;
  questions.forEach((q, i) => {
    const a = answers ? answers[i] : undefined;
    const answered = a !== undefined && a !== null && a.k !== undefined;
    const ok = answered && +a.k === +q.correct;
    const secs = answered && starts && starts[i] ? (a.t - starts[i]) / 1000 : 30;
    pts += quizPoints(ok, answered, secs);
    if (ok) correct++;
  });
  return { pts, correct, n: questions.length, max: 6 * questions.length };
}
/** ranked = ids best → worst; each crew takes ⌈size/2⌉ from the top and the rest from the bottom */
function formGroupsTopBottom(ranked, nGroups) {
  const n = ranked.length; nGroups = Math.max(1, Math.min(nGroups, n));
  const sizes = Array.from({ length: nGroups }, (_, g) => Math.floor(n / nGroups) + (g < n % nGroups ? 1 : 0));
  let i = 0, j = n - 1;
  return sizes.map(sz => {
    const g = []; const top = Math.ceil(sz / 2);
    for (let k = 0; k < top; k++) g.push(ranked[i++]);
    for (let k = top; k < sz; k++) g.push(ranked[j--]);
    return g;
  });
}
function autoGroupCount(n) { if (n < 4) return 1; return Math.max(2, Math.ceil(n / 4)); }

// ── challenges ─────────────────────────────────────────────────────────
function slots(SC) { return SC.build.slots; }
function typeOf(SC, cid) { return slots(SC)[+String(cid).split('-')[1]] || 'BANK'; }
/** problems that prevent a challenge from being played ([] = ready) */
function validateChallenge(SC, ch, type, hasImg) {
  const p = []; ch = ch || {};
  const txt = v => String(v || '').trim();
  if (txt(ch.stem).length < 8) p.push('question');
  const opts = (ch.options || []).slice(0, 4).map(txt);
  if (opts.length < 4 || opts.some(o => !o)) p.push('4 options');
  else if (new Set(opts.map(o => o.toLowerCase())).size < 4) p.push('options must differ');
  if (!(ch.correct >= 0 && ch.correct <= 3)) p.push('correct option');
  if (type === 'CHART') {
    if (!ch.chart) p.push('type of chart');
    if (!(hasImg || ch.hasImg)) p.push('chart image');
    if (txt(ch.code).length < 8) p.push('code (METAR / TAF / SIGMET)');
  }
  return p;
}
function buildOrder(SC, groups) {
  const gids = Object.keys(groups || {}).sort();
  const lists = gids.map(g => slots(SC).map((t, i) => ({ cid: g + '-' + i, t, ch: ((groups[g] || {}).ch || {})[i] }))
    .filter(x => validateChallenge(SC, x.ch, x.t).length === 0).map(x => x.cid));
  const out = []; let more = true;
  for (let r = 0; more; r++) { more = false; lists.forEach(l => { if (l[r]) { out.push(l[r]); more = true; } }); }
  return out;
}
function challengeOf(groups, cid) { const [g, i] = String(cid).split('-'); return (((groups || {})[g] || {}).ch || {})[i] || null; }
/** was a bank question changed by the crew? */
function edited(ch, bank) {
  if (!ch || !ch.src) return 'own';
  const b = (bank || []).find(q => q.id === ch.src); if (!b) return 'own';
  const same = String(ch.stem || '').trim() === b.text.trim() && (ch.options || []).every((o, k) => String(o || '').trim() === String(b.options[k] || '').trim()) && +ch.correct === +b.correct;
  return same ? 'bank' : 'edited';
}

/**
 * results: game points per crew, per-challenge table, K/S/A per student.
 * D = { students, groups, ans:{cid:{gid:{k,t}}}, played:[cid], override:{cid:'void'}, quality:{cid:1..3}, peer }
 */
function compute(SC, D) {
  const gids = Object.keys(D.groups || {}).sort();
  const G = SC.game, played = D.played || [];
  const game = {}; gids.forEach(g => game[g] = 0);
  const per = {}; gids.forEach(g => per[g] = { bank: [], chart: [], design: [] });
  const items = {};
  played.forEach(cid => {
    const author = cid.split('-')[0], ch = challengeOf(D.groups, cid); if (!ch || !game.hasOwnProperty(author)) return;
    const type = typeOf(SC, cid), ans = (D.ans || {})[cid] || {};
    const valid = (D.override || {})[cid] !== 'void';
    const rows = {}; let right = 0, wrong = 0;
    gids.filter(g => g !== author).forEach(g => {
      const a = ans[g], answered = !!a && a.k !== undefined && a.k !== null, ok = answered && +a.k === +ch.correct;
      const pts = valid && ok ? G.right : 0;
      if (valid) { (type === 'CHART' ? per[g].chart : per[g].bank).push(ok ? 1 : 0); game[g] += pts; }
      if (ok) right++; else wrong++;
      rows[g] = { k: answered ? +a.k : null, ok, pts };
    });
    const apts = valid ? G.authorPerMiss * wrong : 0;
    game[author] += apts;
    const disc = right > 0 && wrong > 0, q = (D.quality || {})[cid];
    const design = !valid ? 0 : q ? (q - 1) / 2 : 0.6 + (disc ? 0.4 : 0);
    items[cid] = { cid, author, type, valid, rows, right, wrong, authorPts: apts, disc, design };
  });
  gids.forEach(g => slots(SC).forEach((t, i) => {
    const cid = g + '-' + i, it = items[cid];
    if (it) per[g].design.push(it.design);
    else if (validateChallenge(SC, ((D.groups[g] || {}).ch || {})[i], t).length) per[g].design.push(0);
  }));
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const W = SC.scoring.weights, sp = SC.scoring.split, pScale = +SC.peer.scale || 5;
  const ksa = {};
  Object.entries(D.students || {}).forEach(([sid, st]) => {
    const P = per[st.group] || { bank: [], chart: [], design: [] };
    const pre = st.pre && st.pre.max ? Math.max(0, Math.min(1, st.pre.pts / st.pre.max)) : null;
    const recv = []; Object.entries(D.peer || {}).forEach(([r, m]) => { if (r !== sid && m && m[sid]) { const v = Object.values(m[sid]).map(Number).filter(x => x > 0); if (v.length) recv.push(mean(v)); } });
    const peer = recv.length ? (mean(recv) - 1) / Math.max(1, pScale - 1) : null;
    const comp = { K: { pretest: pre, bank: mean(P.bank) }, S: { chart: mean(P.chart), design: mean(P.design) }, A: { peer } };
    const dim = {};
    ['K', 'S', 'A'].forEach(d => { let n = 0, w = 0; Object.entries(sp[d]).forEach(([k, x]) => { const v = comp[d][k]; if (v !== null && v !== undefined) { n += x * v; w += +x; } }); dim[d] = w ? n / w : null; });
    const r1 = v => Math.round(v * 10) / 10;
    ksa[sid] = { K: dim.K === null ? null : r1(dim.K * W.K), S: dim.S === null ? null : r1(dim.S * W.S), A: dim.A === null ? null : r1(dim.A * W.A), comp };
    ksa[sid].total = r1((ksa[sid].K || 0) + (ksa[sid].S || 0) + (ksa[sid].A || 0));
  });
  return { game, items, ksa, per };
}

function scheduleResolved(SC) { let t = 0; return SC.schedule.map(m => { const o = Object.assign({}, m, { start: t, end: t + m.min }); t += m.min; return o; }); }
function hhmm(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(Math.round(min % 60)).padStart(2, '0'); }
function publicConfig(SC) {
  const P = JSON.parse(JSON.stringify(SC));
  P.pretest.questions = P.pretest.questions.map(q => ({ id: q.id, area: q.area, text: q.text, options: q.options }));
  return P;
}

const KSAD = { quizPoints, gradePretest, formGroupsTopBottom, autoGroupCount, slots, typeOf, validateChallenge, buildOrder, challengeOf, edited, compute, scheduleResolved, hhmm, publicConfig };
if (typeof module !== 'undefined' && module.exports) module.exports = KSAD; else root.KSAD = KSAD;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/*!
 * KSA ENGINE — ksa-db.js
 * One small API over two back-ends:
 *   • firebase — Firebase Realtime Database (the course project), for the real class
 *   • local    — in-browser database shared between tabs of ONE browser (BroadcastChannel);
 *                for testing, demos and a single-computer fallback. No internet needed.
 * All paths are relative to  ksa/<SESSION CODE>/
 */
(function (root) {
'use strict';

const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAEfZ0FsSFhy1GhKh1jT3BJXrWDd-MwJ68',
  authDomain: 'meteorology-quiz-2b061.firebaseapp.com',
  databaseURL: 'https://meteorology-quiz-2b061-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'meteorology-quiz-2b061',
  storageBucket: 'meteorology-quiz-2b061.firebasestorage.app'
};
const ROOT = 'ksa';
const SDK = 'https://www.gstatic.com/firebasejs/9.23.0/';

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Cannot load ' + src)); document.head.appendChild(s); });
}
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const split = p => String(p || '').split('/').filter(Boolean);

// ════════════════════════════════════════════════════════════════════════
// FIREBASE BACK-END
// ════════════════════════════════════════════════════════════════════════
async function firebaseDB(code) {
  if (!root.firebase) { await loadScript(SDK + 'firebase-app-compat.js'); await loadScript(SDK + 'firebase-database-compat.js'); }
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database(app);
  const base = `${ROOT}/${code}`;
  const ref = p => db.ref(p ? `${base}/${p}` : base);
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  return {
    mode: 'firebase', code,
    now: () => Date.now() + offset,
    get: p => ref(p).once('value').then(s => s.val()),
    set: (p, v) => ref(p).set(clean(v)),
    update: (p, o) => ref(p).update(clean(o)),
    push: (p, v) => { const r = ref(p).push(); return r.set(clean(v)).then(() => r.key); },
    remove: p => ref(p).remove(),
    on: (p, cb) => { const r = ref(p); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    onChild: (p, cb) => { const r = ref(p); const h = s => cb(s.key, s.val()); r.on('child_added', h); return () => r.off('child_added', h); },
    connected: cb => db.ref('.info/connected').on('value', s => cb(!!s.val())),
    exists: () => ref('state').once('value').then(s => s.exists())
  };
}
function clean(v) {        // Firebase rejects undefined
  return JSON.parse(JSON.stringify(v === undefined ? null : v));
}

// ════════════════════════════════════════════════════════════════════════
// LOCAL BACK-END (tabs of the same browser)
// ════════════════════════════════════════════════════════════════════════
function localDB(code) {
  const ch = new BroadcastChannel('ksa-local-' + code);
  const me = Math.random().toString(36).slice(2);
  let tree = {};
  const subs = [];            // {path:[...], cb, child, seen:Set}
  let pending = new Set(), flushT = null;

  function getAt(t, parts) { let o = t; for (const k of parts) { if (o == null || typeof o !== 'object') return undefined; o = o[k]; } return o; }
  function setAt(parts, v) {

    else if (op.t === 'update') Object.entries(op.v).forEach(([k, v]) => setAt(split(op.p).concat(split(k)), clone(v)));
    const touched = op.t === 'update' ? Object.keys(op.v).map(k => split(op.p).concat(split(k))) : [split(op.p)];
    subs.forEach(s => { if (touched.some(t => overlap(t, s.path))) pending.add(s); });

  }

    flushT = null; const list = [...pending]; pending.clear();

  const api = {
    mode: 'local', code,
    now: () => Date.now(),
    get: p => readyP.then(() => clone(getAt(tree, split(p))) ?? null),
    set: (p, v) => write({ t: 'set', p, v: clone(v) }),
    update: (p, o) => write({ t: 'update', p, v: clone(o) }),
    push: (p, v) => { const k = Date.now().toString(36) + (pushN++).toString(36).padStart(3, '0') + me.slice(0, 4); return write({ t: 'set', p: p + '/' + k, v: clone(v) }).then(() => k); },
    remove: p => write({ t: 'set', p, v: null }),
    on: (p, cb) => { const s = { path: split(p), cb }; subs.push(s); readyP.then(() => { pending.add(s); flush(); }); return () => subs.splice(subs.indexOf(s), 1); },
    onChild: (p, cb) => { const s = { path: split(p), cb, child: true, seen: new Set() }; subs.push(s); readyP.then(() => { pending.add(s); flush(); }); return () => subs.splice(subs.indexOf(s), 1); },

}

  if (ST.preDone) return M(`<div class="big"><div class="ic">🏁</div><h1>${MY.pre ? MY.pre.pts + ' pts' : 'Done'}</h1>${MY.pre ? `<p>${MY.pre.correct}/${MY.pre.n} correct</p>` : ''}<p class="muted">Crews are being formed…</p></div>`);
  const p = ST.pre || { idx: 0 }, q = SC.pretest.questions[p.idx]; if (!q) return;
  const a = (MY.preAns || {})[p.idx];
  M(`<div class="row between"><span class="lbl">Question ${p.idx + 1}/${SC.pretest.questions.length}</span><b id="ptm" class="mono"></b></div><div class="tbar"><div id="pbar"></div></div>
    <div class="q">${esc(q.text)}</div><div class="opts">${q.options.map((o, k) => `<button class="o ${a && +a.k === k ? 'sel' : ''}" data-a="ans" data-k="${k}" ${a || p.reveal ? 'disabled' : ''}><span class="L">${L(k)}</span>${esc(o)}</button>`).join('')}</div>
    <p class="muted" style="margin-top:12px;text-align:center">${a ? 'Answer registered ✓' : p.reveal ? 'Time is up' : ''}</p>`);
  tick();
}
A.ans = async b => {
  const p = ST.pre; if (!p || p.reveal || (MY.preAns || {})[p.idx]) return;
  document.querySelectorAll('.o').forEach(x => { x.disabled = true; x.classList.toggle('sel', x === b); });
  MY.preAns = Object.assign({}, MY.preAns, { [p.idx]: { k: +b.dataset.k, t: now() } });
  await DB.set(`students/${ID}/preAns/${p.idx}`, MY.preAns[p.idx]);
};
// ── peer ──
function peerView() {
  const g = GRP[MY.group]; if (!g) return M('<div class="big"><h1>No crew</h1></div>');
  const mates = g.members.filter(id => id !== ID && STU[id]), C = SC.peer.criteria, n = SC.peer.scale;
  PEER = PEER || {};
  if (!mates.length) return M('<div class="big"><h1>No crew-mates to rate</h1></div>');
  M(`<h1>Peer assessment</h1><p class="muted">Rate each crew-mate from 1 (low) to ${n} (high). Anonymous for your colleagues.</p>
    ${mates.map(m => `<div class="peer"><b>${esc(STU[m].name)}</b>${C.map(c => `<div class="crit"><span>${esc(c.label)}</span><div class="sc">${Array.from({ length: n }, (_, k) => `<button class="${+((PEER[m] || {})[c.id]) === k + 1 ? 'on' : ''}" data-a="rate" data-m="${m}" data-c="${c.id}" data-v="${k + 1}">${k + 1}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
    <button class="btn go lg" style="width:100%" data-a="peerSend">Send ✓</button>`);
}
A.rate = b => { PEER[b.dataset.m] = PEER[b.dataset.m] || {}; PEER[b.dataset.m][b.dataset.c] = +b.dataset.v; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
A.peerSend = async () => {
  const g = GRP[MY.group], mates = g.members.filter(id => id !== ID && STU[id]);
  if (mates.some(m => SC.peer.criteria.some(c => !(PEER[m] || {})[c.id]))) return KSAPP.toast('Rate every criterion for every crew-mate');
  await DB.set('peer/' + ID, PEER); KSAPP.toast('Sent — thank you');
};
function tick() {
  if (ST.phase === 'pretest' && ST.pre && !ST.preDone) {
    const lim = SC.pretest.secondsPerQ * 1000, el = (ST.hold || now()) - ST.pre.at, left = Math.max(0, lim - el);
    const b = document.getElementById('pbar'); if (b) b.style.width = (ST.pre.reveal ? 0 : left / lim * 100) + '%';
    const t = document.getElementById('ptm'); if (t) t.textContent = ST.pre.reveal ? '' : Math.ceil(left / 1000) + '″';
    if (!ST.pre.reveal && left <= 0) document.querySelectorAll('.o').forEach(x => x.disabled = true);
  }
  const d = ST.duel || {};
  if (ST.phase === 'duel' && d.stage === 'vote') { const b = document.getElementById('vbar'); if (b) b.style.width = Math.max(0, Math.min(100, (d.endsAt - (ST.hold || now())) / Math.max(1, d.endsAt - d.at) * 100)) + '%'; }
}
</script>
</body>
